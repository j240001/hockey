// =========================================================
// MAIN LOOP
// =========================================================


function loop(now) {


    // +++ AUDIO UPDATE +++
    updateCrowdAmbience(); 
    // +++ END AUDIO +++

    frameCount++;
    if (now - lastTime >= 1000) {
        fps = frameCount;
        frameCount = 0;
        lastTime = now;
    }

    // 1. GLOBAL UPDATES
    updateLivingCrowd(); 

    const isStoppage = isResetActive() || performance.now() < faceoffPauseUntil;
    if (isStoppage && !isGoalCelebrationActive()) {
        calculateExodus();
    }

    if (typeof isGoalCelebrationActive === 'function' && isGoalCelebrationActive()) {
        if (team1Excitement === AMBIENT_EXCITEMENT && team0Excitement === AMBIENT_EXCITEMENT) {
            triggerGoalExcitement(lastGoalTeam);
        }
    }

    // 2. PLAYOFF BRACKET (Visual Tree)
    if (gameState === 'playoff_bracket') {
        if (typeof Playoffs !== 'undefined') Playoffs.drawBracket(ctx, W, H);
        requestAnimationFrame(loop);
        return;
    }

    // 3. PLAYOFF GAMEPLAY (Handles Warp Speed)
    if (gameState === 'playoffs') {
        // This is the magic line that enables the "W" key speed-up
        if (typeof Playoffs !== 'undefined') Playoffs.runGameTick(now);
        requestAnimationFrame(loop);
        return;
    }

    // 4. TOURNAMENT (Regular Season)
    if (gameState === 'tournament') {
        requestAnimationFrame(loop); 
        return; 
    }
    if (gameState === 'tournament_over') {
        if (typeof drawTournamentResults === 'function') drawTournamentResults();
        requestAnimationFrame(loop);
        return;
    }

    // 5. PAUSED / REPLAY
    if (typeof isPaused !== 'undefined' && isPaused) {
        renderFrame();
        lastTime = now;
        lastGameTimeUpdate = now;
        if (goalResetTimer) goalResetTimer += 16;
        if (whistleEndTimer) whistleEndTimer += 16;
        if (faceoffPauseUntil) faceoffPauseUntil += 16;
        requestAnimationFrame(loop);
        return;
    }

    // 6. UI STATES
    if (gameState === 'menu') { drawMenu(); requestAnimationFrame(loop); return; }
    if (gameState === 'options') { drawOptionsMenu(); requestAnimationFrame(loop); return; }
    
    // *** NEW: CHAMPION SCREEN HANDLER ***
    if (gameState === 'champion_screen') {
        // Just draw the bracket (which handles the Trophy text and View Toggle)
        if (typeof Playoffs !== 'undefined') {
            Playoffs.drawBracket(ctx, W, H);
        }
        requestAnimationFrame(loop);
        return; // <--- CRITICAL: Stops the code from falling through to physics
    }
    // ************************************

    // GAME OVER INTERCEPT
    if (gameState === 'gameover') { 
        if (typeof Playoffs !== 'undefined' && Playoffs.active) {
            Playoffs.reportGameResult(scoreTeam0, scoreTeam1);
            requestAnimationFrame(loop);
            return;
        }
        return handleGameOver(now); 
    }

    if (gameState === 'intermission') { renderFrame(); requestAnimationFrame(loop); return; }
    if (gameState === 'training_menu') { drawTrainingMenu(); requestAnimationFrame(loop); return; }
    if (gameState === "training_intermission") {
        ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
        if (typeof renderTournamentStatus === 'function') renderTournamentStatus();
        const curNow = performance.now();
        if (curNow > trainingIntermissionTimer) AICoach.startEpisode(); 
        requestAnimationFrame(loop);
        return;
    }

    // =====================================================
    // 7. STANDARD GAMEPLAY (Exhibition Mode)
    // =====================================================
    // This only runs if we are NOT in playoffs/tournament mode
    
    const isGameFlowPaused = isResetActive() || performance.now() < faceoffPauseUntil;

    if (isGameFlowPaused) {
        updateClock(now); 
        if (isGoalCelebrationActive()) {
            puck.update();
            collideCircleWithRink(puck, puck.r, 0.8);
            for (const p of players) { updatePlayer(p); enforcePlayerWalls(p); }
            resolvePlayerCollisions();
            if (goalResetTimer - now > 4000 && typeof captureReplayFrame === 'function') captureReplayFrame();
        }
        if (whistleEndTimer && now >= whistleEndTimer) { whistleEndTimer = null; doFaceoffReset(); } 
        else if (goalResetTimer && now >= goalResetTimer) {
            goalResetTimer = null; 
            
            // --- FIXED SUDDEN DEATH LOGIC ---
            if (isSuddenDeathGoal) {
                // 1. Update the final score immediately so the replay shows the winner
                if (lastGoalTeam === 0) scoreTeam0++;
                if (lastGoalTeam === 1) scoreTeam1++;
                
                // 2. Play the Replay, THEN end the game
                if (typeof startInstantReplay === 'function') {
                    startInstantReplay(() => { 
                        gameState = "gameover"; // End game AFTER replay finishes
                        isSuddenDeathGoal = false;
                    });
                } else {
                    // Fallback if replay system missing
                    gameState = "gameover"; 
                    isSuddenDeathGoal = false; 
                }
            } 
            // --- NORMAL GOAL LOGIC ---
            else {
                if (typeof startInstantReplay === 'function') {
                    startInstantReplay(() => { doGoalReset(); });
                } else {
                    doGoalReset();
                }
            }
        }
        if (!TRAINING_MODE || WATCH_MODE) renderFrame();
        requestAnimationFrame(loop);
        return;
    }

    // Active Physics
    const safeReplayCheck = (typeof isReplaying !== 'undefined') ? !isReplaying : true;
    if (!TRAINING_MODE && safeReplayCheck) {


        processFaceoffDrop();

        puck.update();

        updateDroppedSticks(); // <--- NEW

        checkOffsides();
        checkDeadPuck(); 
        resolveGoalCollisions(puck);
        checkGoalieHarassment();
        checkNetPinning(); 
        if (puckEscapedRink()) handlePuckEscape();
        if (puckStealCooldown > 0) puckStealCooldown--;
        checkGoal(); 
        
        if (detectPuckStuckInNet()) {
            whistle("Net Mesh Stoppage"); 
            if (!TRAINING_MODE || WATCH_MODE) renderFrame();
            requestAnimationFrame(loop);
            return; 
        }
        
        for (const p of players) {
            updatePlayer(p);
            resolveGoalCollisions(p);
            blockPlayerFromGoal(p);  
            enforcePlayerWalls(p);
        }
        resolvePlayerCollisions();
        if (typeof captureReplayFrame === 'function') captureReplayFrame();
    }

    if (!TRAINING_MODE || WATCH_MODE) renderFrame();
    updateClock(now);
    requestAnimationFrame(loop);
}





// =========================================================
// FAST TRAINING LOOP (Phase 4.5)
// =========================================================
function trainingLoop() {
    if (!TRAINING_MODE) return;

    TRAIN_EPISODE_ACTIVE = true;

    // Adjust speed depending on watch mode
    const STEPS_PER_TICK = WATCH_MODE ? 1 : 100;
    
// --- PAUSE CHECK (Training mode) ---
if (isResetActive()) {
    const now = performance.now();
    
    // 🏒 CELEBRATION: Animate players (even in fast training)
    if (isGoalCelebrationActive()) {
        for (const p of players) {
            updatePlayer(p);
            enforcePlayerWalls(p);
        }
        resolvePlayerCollisions();
    }
    
    // Check 1: Whistle expired
    if (whistleEndTimer && now >= whistleEndTimer) {
        whistleEndTimer = null; // <-- ADD THIS LINE
        doFaceoffReset();
    } 
    // Check 2: Goal expired
    else if (goalResetTimer && now >= goalResetTimer) {
        doGoalReset(); 
    }
    
    // Wait/render, no physics
    trainingTimeoutId = setTimeout(trainingLoop, WATCH_MODE ? 16 : 0);
    return;
}
    // ------------------------------------


    for (let i = 0; i < STEPS_PER_TICK; i++) {
        puck.update();
        checkOffsides();
        checkGoalieHarassment();
        checkNetPinning(); 

        // *** NEW: SOLID GOAL COLLISION ***
        resolveGoalCollisions(puck);

        if (puckEscapedRink()) handlePuckEscape();

        trainingTick(performance.now());
        trainingAutoEnd();

        if (puckStealCooldown > 0) puckStealCooldown--;

        checkGoal();
        
        // If a whistle/goal was triggered during this tick, break the loop early
        if (isResetActive()) break; 

        for (const p of players) {
            updatePlayer(p);
            enforcePlayerWalls(p);
            // keepSkatersOutOfNet(p);
        }

        resolvePlayerCollisions();
    }

    ticksSinceLastGoal++;
    if (ticksSinceLastGoal > FAILSAFE_MAX_TICKS) {
        // console.warn("⚠️ Failsafe triggered — resetting episode.");
        resetAfterGoal(-1);  // Use -1 to signify no team scored
        ticksSinceLastGoal = 0;
    }

    // Schedule next run, with delay if WATCH_MODE is on
    if (gameState !== 'menu') {
        trainingTimeoutId = setTimeout(trainingLoop, WATCH_MODE ? 16 : 0);
    } else {
        trainingTimeoutId = null;
    }
}

// =========================================================
// PRACTICE SANDBOX MODE (Updated with Live Capture)
// =========================================================
const Practice = {
    active: false,
    pausedState: null, // Snapshot of positions & velocities
    selectedIdx: 0,    // 0=Puck, 1..N=Players
    
    // Toggle Practice Mode manually
    toggle: function() {
        this.active = !this.active;
        gameState = this.active ? 'practice' : 'menu';
        
        if (this.active) {
            isPaused = true; // Freeze immediately
            faceoffPauseUntil = 0;
            goalResetTimer = null;
            whistleEndTimer = null;
            
            // If we don't have a saved state yet, save the current one
            if (!this.pausedState) this.captureLiveState();
        }
    },

    // *** NEW: CAPTURE THE MOMENT ***
    captureLiveState: function() {
        this.pausedState = {
            // Capture Puck Physics
            puck: { 
                x: puck.x, y: puck.y, 
                vx: puck.vx, vy: puck.vy,
                ownerId: puck.ownerId 
            },
            // Capture Player Physics
            players: players.map(p => ({ 
                id: p.id,
                x: p.x, y: p.y, 
                vx: p.vx, vy: p.vy, 
                angle: p.angle 
            }))
        };
        
        // Force game into Practice Mode
        this.active = true;
        gameState = 'practice';
        isPaused = true; // Freeze
        
        // console.log("📸 SCENE CAPTURED! Press SPACE to Replay.");
    },

    restoreState: function() {
        if (!this.pausedState) return;
        
        const s = this.pausedState;
        
        // Restore Puck
        puck.x = s.puck.x; 
        puck.y = s.puck.y;
        puck.vx = s.puck.vx; 
        puck.vy = s.puck.vy;
        puck.ownerId = s.puck.ownerId; // Restore possession if held

        // Restore Players
        // We match by ID to ensure stability
        s.players.forEach(saved => {
            const p = getPlayerById(saved.id);
            if (p) {
                p.x = saved.x;
                p.y = saved.y;
                p.vx = saved.vx; 
                p.vy = saved.vy;
                p.angle = saved.angle;
                
                // Reset Brain Memory so they rethink the situation fresh
                if (p.brain) p.brain = {}; 
            }
        });
        
        // Ensure we are paused so we can see the setup
        isPaused = true; 
    },

    runPlay: function() {
        // Toggle: If Frozen -> Run. If Running -> Reset.
        if (isPaused) {
            isPaused = false; // Action!
        } else {
            this.restoreState(); // Reset to snapshot
        }
    },
    
    // ... [Keep cycleSelection, moveSelection, cycleStrategy, drawUI as they were] ...
    cycleSelection: function() {
        this.selectedIdx++;
        if (this.selectedIdx > players.length) this.selectedIdx = 0;
    },

    moveSelection: function(dx, dy) {
        if (this.selectedIdx === 0) {
            puck.x += dx; puck.y += dy; puck.vx = 0; puck.vy = 0;
        } else {
            const p = players[this.selectedIdx - 1];
            if (p) { p.x += dx; p.y += dy; p.vx = 0; p.vy = 0; }
        }
    },

    cycleStrategy: function(teamId) {
        const keys = Object.keys(Strategies);
        if (keys.length === 0) return;
        let currentId = (teamId === 0) ? Team0_Strategy.id : Team1_Strategy.id;
        let idx = keys.indexOf(currentId);
        idx = (idx + 1) % keys.length;
        const newStrat = Strategies[keys[idx]];
        if (teamId === 0) {
            Team0_Strategy = newStrat;
            TEAM0_COLOR = newStrat.colors.main;
            TEAM0_COLOR_HAS_PUCK = newStrat.colors.secondary;
        } else {
            Team1_Strategy = newStrat;
            TEAM1_COLOR = newStrat.colors.main;
            TEAM1_COLOR_HAS_PUCK = newStrat.colors.secondary;
        }
    },

    drawUI: function() {
        if (gameState !== 'practice') return;

        ctx.save();
        // Banner
        ctx.fillStyle = "rgba(200, 50, 0, 0.8)"; // Red for "Recording" feel
        ctx.fillRect(0, 0, W, 40);
        ctx.fillStyle = "#fff";
        ctx.font = "bold 20px Arial";
        ctx.textAlign = "center";
        ctx.fillText(`SCENE EDITOR - [SPACE] Replay | [C] Capture New | [ARROWS] Move`, W/2, 27);

        // Selection Ring
        let targetX = 0, targetY = 0, r = 0;
        if (this.selectedIdx === 0) { targetX = puck.x; targetY = puck.y; r = 15; } 
        else { const p = players[this.selectedIdx - 1]; if (p) { targetX = p.x; targetY = p.y; r = 25; } }

        ctx.strokeStyle = "white"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(targetX, targetY, r, 0, Math.PI*2); ctx.stroke();

        ctx.restore();
    }
};






// --- INPUT HOOK  ---
document.addEventListener("keydown", e => {
    
    // 1. GLOBAL CAPTURE KEY (Works in Game OR Pause)
    if (e.key === 'c' || e.key === 'C') {
        // SAFETY: Disable "Capture" during competitive modes too
        if (gameState === "tournament" || gameState === "playoffs") return;

        if (gameState === 'playing' || isPaused) {
            Practice.captureLiveState();
        }
        return;
    }

    // 2. TOGGLE PRACTICE MODE (*** RESTRICTED ***)
    if (e.key === 'm' || e.key === 'M') {
        
        // RESTRICTION: Disable Practice Mode during competitive play.
        // This ensures 'M' does NOTHING here, so the Playoff Engine can use it (or ignore it).
        if (gameState === "tournament" || gameState === "tournament_over" ||
            gameState === "playoffs" || gameState === "playoff_bracket" || 
            gameState === "champion_screen") {
            return; 
        }

        Practice.toggle();
        return;
    }

    // 3. PRACTICE CONTROLS
    if (Practice.active) {
        if (e.key === "Tab") { e.preventDefault(); Practice.cycleSelection(); }
        if (e.key === " ")   { e.preventDefault(); Practice.runPlay(); }
        if (e.key === "[")   Practice.cycleStrategy(0);
        if (e.key === "]")   Practice.cycleStrategy(1);

        const speed = e.shiftKey ? 10 : 2;
        if (e.key === "ArrowUp")    Practice.moveSelection(0, -speed);
        if (e.key === "ArrowDown")  Practice.moveSelection(0, speed);
        if (e.key === "ArrowLeft")  Practice.moveSelection(-speed, 0);
        if (e.key === "ArrowRight") Practice.moveSelection(speed, 0);
        
        if (isPaused && (e.key.startsWith("Arrow"))) {
             Practice.captureLiveState(); 
        }
    }
});

// =========================================================
// AUDIO ENGINE (Howler.js Integration)
// =========================================================
var sound = new Howl({
    src: ['sprite.mp3'], 
    volume: 1.0,
    sprite: {
        crowd_bed:  [0, 152737, true], 
        goal_horn:  [152737, 3105],
        puck_board: [155842, 416],
        shoot_puck: [156258, 415],
        referee_whistle: [156673, 280]
    }
});

// Store all layer IDs so we can fade them together
let crowdLayers = [];

function initAudio() {
    // Only initialize if we haven't already
    if (crowdLayers.length > 0) return;

    // --- LAYER 1: The Foundation (Starts at 0s) ---
    let id1 = sound.play('crowd_bed');
    sound.seek(0, id1);
    sound.volume(0, id1);           // Start silent
    crowdLayers.push(id1);

    // --- LAYER 2: The Widener (Starts at 7s) ---
    // Offsetting the start time prevents "flanging" (robotic sound)
    let id2 = sound.play('crowd_bed');
    sound.seek(7.0, id2);           // Jump 7 seconds into the loop
    sound.rate(1.01, id2);          // 1% faster (prevents loops from syncing up)
    sound.volume(0, id2);
    crowdLayers.push(id2);

    // --- LAYER 3: The Texture (Starts at 15s) ---
    let id3 = sound.play('crowd_bed');
    sound.seek(15.0, id3);          // Jump 15 seconds into the loop
    sound.rate(0.99, id3);          // 1% slower (adds bass/depth)
    sound.volume(0, id3);
    crowdLayers.push(id3);
}




// Track whether the crowd is currently audible
let currentAmbienceState = 'off'; 

function updateCrowdAmbience() {
    // 1. Determine if we SHOULD hear the crowd right now
    let shouldHear = false;

    // A. Normal Gameplay
    if (gameState === 'playing') shouldHear = true;
    
    // B. Playoffs (Only if watching)
    if (gameState === 'playoffs' && typeof Playoffs !== 'undefined' && Playoffs.watchMode) {
        shouldHear = true;
    }
    
    // C. Tournament (Only if watching)
    if (gameState === 'tournament' && typeof Tournament !== 'undefined' && Tournament.watchMode) {
        shouldHear = true;
    }
    
    // D. Training (Only if watching)
    if (TRAINING_MODE && WATCH_MODE) shouldHear = true;

    // --- EXECUTE FADES ---

    // CASE 1: Turn ON (Fade In)
    if (shouldHear && currentAmbienceState === 'off') {
        currentAmbienceState = 'on';
        // Fade all layers from 0 to 0.15 over 2 seconds
        crowdLayers.forEach(id => sound.fade(0, 0.15, 2000, id));
    } 
    // CASE 2: Turn OFF (Fade Out)
    else if (!shouldHear && currentAmbienceState === 'on') {
        currentAmbienceState = 'off';
        // Fade all layers from current vol to 0 over 1 second
        crowdLayers.forEach(id => sound.fade(sound.volume(id), 0, 1000, id));
    }
}



// HELPER: Only play sounds if we are in a "Real Time" mode
function playGameSound(name, volumeOverride) {
    // 1. TRAINING MODE CHECK
    // If training, only play if we are explicitly watching
    if (TRAINING_MODE && !WATCH_MODE) return; 

    // 2. TOURNAMENT MODE CHECK
    if (gameState === 'tournament') {
        // If the Tournament object exists but we aren't watching, MUTE.
        // (Assuming 'watchMode' is the flag toggled by 'W')
        if (typeof Tournament !== 'undefined' && !Tournament.watchMode) return;
    }

    // 3. PLAYOFFS MODE CHECK
    if (gameState === 'playoffs') {
        // If the Playoffs object exists but we aren't watching, MUTE.
        if (typeof Playoffs !== 'undefined' && !Playoffs.watchMode) return;
    }

    // 4. Play the sound (Passed all checks)
    var id = sound.play(name);
    
    // 5. Apply Volume if provided
    if (volumeOverride !== undefined) {
        sound.volume(volumeOverride, id);
    }
}


// Helper to handle Replay Ducking for ALL layers
function setCrowdReplayMode(isReplay) {
    crowdLayers.forEach(id => {
        if (isReplay) {
            // Duck all layers down to 5%
            sound.fade(0.15, 0.05, 300, id); 
        } else {
            // Bring all layers back to 15%
            sound.fade(0.05, 0.15, 1000, id);
        }
    });
}

// Initialize audio on first user interaction
window.addEventListener('click', () => {
    if (Howler.ctx.state === 'suspended') Howler.ctx.resume();
    initAudio();
}, { once: true });

// +++ FIX FOR MOBILE AUDIO +++
window.addEventListener('touchstart', () => {
    if (Howler.ctx.state === 'suspended') {
        Howler.ctx.resume();
    }
    initAudio();
}, { once: true });

window.addEventListener('keydown', () => {
    if (Howler.ctx.state === 'suspended') Howler.ctx.resume();
    initAudio();
}, { once: true });


</script>
