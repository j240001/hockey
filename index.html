// =========================================================
// PUCK OBJECT (Updated for V5 Stick Ownership)
// =========================================================
const puck = {
    px: RX,
    py: RY,
    x: RX,
    y: RY,
    vx: 0,
    vy: 0,
    r: 1.5,
    ownerId: null,
    ignoreGoalieUntil: 0,
    isShot: false, // Track if it's a projectile
    lastOwnerId: null, // Track who touched it last for stats
    passTargetId: null, // Track active pass destination

    update() {
        // --- 1. TRACK STATE ---
        this.px = this.x;
        this.py = this.y;
        const owner = getPlayerById(this.ownerId);

        // --- 2. HELD STATE (FIXED) ---
        if (owner) {
            // A. GOALIE (Keep old logic - Center of Body)
            if (owner.type === "goalie") {
                this.x = owner.x;
                this.y = owner.y;
            } 
            // B. SKATER (New Logic - Stick Blade)
            else if (owner.cradlePos) {
                // We trust the kinematics engine. 
                // The puck sits exactly on the tape.
                this.x = owner.cradlePos.x;
                this.y = owner.cradlePos.y;
            } 
            // C. FALLBACK (If kinematics haven't run yet)
            else {
                this.x = owner.x;
                this.y = owner.y;
            }

            this.vx = 0;
            this.vy = 0;
            this.ignoreGoalieUntil = 0;
            return; 
        }

        // --- 3. LOOSE STATE (Physics) ---
        // (This part is unchanged, just standard physics)
        const moveLen = Math.hypot(this.vx, this.vy);
        if (moveLen > 0) {
            const steps = Math.ceil(moveLen / this.r) || 1;
            const stepVX = this.vx / steps;
            const stepVY = this.vy / steps;

            for (let i = 0; i < steps; i++) {
                this.x += stepVX;
                this.y += stepVY;

                let hit = collideCircleWithRink(this, this.r, 0.78);
                if (typeof resolveGoalCollisions === "function") {
                    hit = resolveGoalCollisions(this) || hit; 
                }
                if (hit) break;

                // Goalie Interaction Loop (The Dual-Cube System)
                const now = performance.now();
                for (const g of players) {
                    if (g.type !== "goalie") continue;
                    if (this.ignoreGoalieUntil && now < this.ignoreGoalieUntil) continue;

                    // Use our new Dual-Cube Physics
                    if (checkPuckGoalieCollision(this, g) && this.ownerId === null) {
                        
                        if (g.saveCooldown <= 0) { 
                            g.saves++; 
                            g.saveCooldown = 60; 
                        }

                        // Catch Logic (Freeze the puck if it's moving slow enough)
                        const shotSpeed = Math.hypot(this.vx, this.vy);
                        let catchChance = Math.max(0, 0.6 - (shotSpeed * 0.3));
                        
                        if (Math.random() < catchChance) {
                            this.ownerId = g.id; this.vx = 0; this.vy = 0;
                            if (typeof goalieFreezeTimer !== 'undefined') goalieFreezeTimer = performance.now(); 
                            return;
                        }
                        
                        this.ignoreGoalieUntil = now + 250;
                    }
                }
            }
        }

        // Friction
        const MAX_S = 12.0; 
        const curS = Math.hypot(this.vx, this.vy);
        if (curS > MAX_S) { this.vx *= (MAX_S/curS); this.vy *= (MAX_S/curS); }
        this.vx *= 0.991; this.vy *= 0.991;
    },

    draw() {
        // --- VISUAL LIE REMOVED ---
        // We now trust "this.x" and "this.y" implicitly.
        // The kinematics engine moves the puck to the blade for us.
        
        const drawX = this.x;
        const drawY = this.y;

        ctx.fillStyle = "#000";
        ctx.fillRect(drawX - this.r, drawY - this.r, this.r * 2, this.r * 2);
    }
};



// =========================================================
// POSSESSION HELPERS
// =========================================================
function tryPickupPuck(p) {
    if (isResetActive()) return; 
    if (p.stickDropped) return; // Can't pick up puck without a stick!
    if (puck.ownerId !== null) return;


    // *** NEW: FACEOFF IMMUNITY CHECK ***
    // If the puck is "slippery" (just dropped), ignore pickup attempts.
    if (puck.pickupImmunityUntil && performance.now() < puck.pickupImmunityUntil) {
        return;
    }
    // -----------------------------------

    const dx = puck.x - p.x;
    const dy = puck.y - p.y;
    
    // 1. MAGNETISM: Give them a slightly larger reach for loose pucks
    // Old: p.size/2 + puck.r + 5 (~12px)
    // New: p.size/2 + puck.r + 8 (~15px) -> Easier to grab
    const interactDist = p.size/2 + puck.r + 8;

    if (dx*dx + dy*dy <= interactDist*interactDist) {
        
        // --- 2. THE FIX: SPEED CHECK ---
        // If the puck is moving slowly (under 2.0 speed), it is FREE.
        // No dice rolls. No bobbles. Just take it.
        const puckSpeed = Math.hypot(puck.vx, puck.vy);
        
        if (puckSpeed < 2.0) {
            puck.ownerId = p.id;
            puck.vx = 0; puck.vy = 0;
            puck.isShot = false; // Reset shot flag
            puck.lastOwnerId = p.id; // Claim ownership
            if (puck.passTargetId) puck.passTargetId = null;
            return;
        }

        // ================================================================
        // SCENARIO A: IT IS A SHOT (Dangerous Projectile)
        // ================================================================
        if (puck.isShot) {
            // (Keep your existing shot deflection logic here)
            // ...
             const hitChance = (p.team === getPlayerById(puck.lastOwnerId)?.team) ? 0.60 : 0.80;
            if (Math.random() > hitChance) return; 

            // Deflection Physics
            const dist = Math.sqrt(dx*dx + dy*dy);
            const nx = dx / dist; 
            const ny = dy / dist; 
            const tipAngle = (Math.random() - 0.5) * 1.5; 
            const cos = Math.cos(tipAngle);
            const sin = Math.sin(tipAngle);
            const nvx = puck.vx * cos - puck.vy * sin;
            const nvy = puck.vx * sin + puck.vy * cos;
            
            puck.vx = nvx;
            puck.vy = nvy;

            // Dampening
            const isTeammate = (p.team === getPlayerById(puck.lastOwnerId)?.team);
            const dampening = isTeammate ? 0.75 : 0.40;
            puck.vx *= dampening;
            puck.vy *= dampening;

            puck.x = p.x + nx * (interactDist + 2);
            puck.y = p.y + ny * (interactDist + 2);
            puck.isShot = false; 
            return; 
        }

        // ================================================================
        // SCENARIO B: FAST PASS / BOUNCING PUCK
        // ================================================================
        let isTeammate = false;
        if (puck.lastOwnerId) {
            const prevOwner = getPlayerById(puck.lastOwnerId);
            if (prevOwner && prevOwner.team === p.team) isTeammate = true;
        }

        // Teammate Pass (95% catch rate)
        if (isTeammate) {
            if (Math.random() < 0.95) {
                if (puck.passTargetId === p.id && window.BT8_STATS) window.BT8_STATS.completions++;
                puck.passTargetId = null; 
                puck.ownerId = p.id;
                puck.vx = 0; puck.vy = 0;
                return;
            } 
        }
        // Enemy Pass / Loose Neutral Puck (40% steal rate)
        // Only applies if puck is moving FAST (> 2.0)
        else {
            if (Math.random() < 0.40) {
                if (puck.passTargetId !== null) puck.passTargetId = null;
                puck.ownerId = p.id;
                puck.vx = 0; puck.vy = 0;
                return;
            }
        }

        // 3. THE BOBBLE (Failed Catch / Slap-away)
        if (puck.passTargetId !== null) puck.passTargetId = null;

        const dist = Math.sqrt(dx*dx + dy*dy);
        const nx = dx / dist; 
        const ny = dy / dist; 
        
        const dot = puck.vx * nx + puck.vy * ny;
        
        // --- THE SLAP-SHOT RANDOMIZER ---
        // Calculate the pure reflection first
        let newVx = puck.vx - 2 * dot * nx;
        let newVy = puck.vy - 2 * dot * ny;

        // Apply a random "scramble" to the reflection angle
        const scramble = (Math.random() - 0.5) * 0.3; 
        const cosS = Math.cos(scramble);
        const sinS = Math.sin(scramble);
        
        puck.vx = (newVx * cosS - newVy * sinS) * 0.4; // 0.4 keeps it from flying too fast
        puck.vy = (newVx * sinS + newVy * cosS) * 0.4;
        // --------------------------------
        
        puck.x = p.x + nx * (interactDist + 2);
        puck.y = p.y + ny * (interactDist + 2);
    }
}



// ---------------------------------------------------------
// BEHIND-NET SHOT SAFETY (FIXED for SIDE SWAPS)
// ---------------------------------------------------------
function fixBehindNetShotDir(p) {
    // Only care if we're between the posts vertically
    if (p.y < topY || p.y > botY) return null;

    const cosA = Math.cos(p.angle);
    const sinA = Math.sin(p.angle);

    // Identify which coordinate is physically Left vs Right
    const leftGoalX = Math.min(goal1, goal2);
    const rightGoalX = Math.max(goal1, goal2);

    // ---------------------------------
    // LEFT NET (opening to the RIGHT)
    // ---------------------------------
    // Behind net = x < leftGoalX
    // "Facing center" = looking right (cosA > 0)
    if (p.x < leftGoalX + 5 && cosA > 0.4) {
        // Force vertical
        let dirY = Math.sign(sinA);
        if (dirY === 0) dirY = -1;
        return { vxDir: 0, vyDir: dirY };
    }

    // ---------------------------------
    // RIGHT NET (opening to the LEFT)
    // ---------------------------------
    // Behind net = x > rightGoalX
    // "Facing center" = looking left (cosA < 0)
    if (p.x > rightGoalX - 5 && cosA < -0.4) {
        // Force vertical
        let dirY = Math.sign(sinA);
        if (dirY === 0) dirY = 1;
        return { vxDir: 0, vyDir: dirY };
    }

    return null;
}






function shootPuck(player, power, targetOverride) {
    if (puck.ownerId !== player.id) return;

    // 1. SETUP LAUNCH POSITION (The Blade)
    let launchX = player.x;
    let launchY = player.y;
    if (player.bladePos) {
        launchX = player.bladePos.x;
        launchY = player.bladePos.y;
    }

    // 2. DETERMINE BASE TARGET
    let targetX = (player.team === 0) ? goal2 : goal1;
    let targetY = RY; // Default: Center of net
    
    if (targetOverride) {
        targetX = targetOverride.x;
        targetY = targetOverride.y;
    }

    // 3. THE "SNIPER" OVERRIDE: TARGET THE EDGES
    // If the AI is aiming generally at the net, we force it to aim 17px
    // north or south of center. This targets the areas just inside the posts.
    if (Math.abs(targetY - RY) < 10) {
        targetY = (Math.random() < 0.5) ? RY - 17 : RY + 17;
    }

    // 4. CALCULATE POWER (Honest Physics)
    // What you set is what you get. No distance boosts.
    let shotPower = (power !== undefined) ? power : (6 + Math.random() * 7);

    // 5. BEHIND NET SAFETY (Unchanged)
    const behind = fixBehindNetShotDir(player);
    if (behind) {
        player.shootCooldown = 35;
        puck.lastOwnerId = player.id;
        ejectPuckFromOwner(player);
        puck.vx = behind.vxDir * shotPower;
        puck.vy = behind.vyDir * shotPower;
        puck.isShot = true; 
        return;
    }

    // 6. EXECUTE PERFECT SHOT
    player.shootCooldown = 35;
    puck.lastOwnerId = player.id;
    ejectPuckFromOwner(player);
    playGameSound('shoot_puck', 0.08);

    // Aim strictly from Blade to Target
    const finalAngle = Math.atan2(targetY - launchY, targetX - launchX);

    // =========================================================
    // 7. THE SPREAD DIAL (SET TO 0 FOR DEAD ACCURACY)
    // =========================================================
    const SPREAD_AMOUNT = 0.08; // 0 perfect / .200 realistic / .400 terrible
    const randomError = (Math.random() - 0.5) * SPREAD_AMOUNT;
    const shotAngle = finalAngle + randomError;

    puck.vx = Math.cos(shotAngle) * shotPower;
    puck.vy = Math.sin(shotAngle) * shotPower;
    
    puck.isShot = true; 
}



// PASSING SYSTEM — Variable Speed (Soft vs Hard)
function passPuckToTeammate(p, target) {
    if (puck.ownerId !== p.id) return;

    const dxRaw = target.x - p.x;
    const dyRaw = target.y - p.y;
    const dist = Math.hypot(dxRaw, dyRaw);

    // VARIABLE SPEED LOGIC
    let passSpeed = 3.5 + (dist / 100.0);
    passSpeed += (Math.random() * .8 - 0.4); 
    if (passSpeed < 3.0) passSpeed = 3.0;
    if (passSpeed > 5.5) passSpeed = 5.5;

    // Calculate Lead
    const travelTime = dist / passSpeed;
    
    let leadX = target.vx * travelTime;
    let leadY = target.vy * travelTime;
    
    const leadMag = Math.hypot(leadX, leadY);
    if (leadMag > 60) {
        leadX = (leadX / leadMag) * 60;
        leadY = (leadY / leadMag) * 60;
    }

    let tx = target.x + leadX;
    let ty = target.y + leadY;

    // Clamp
    tx = Math.max(RINK_MIN_X + 25, Math.min(RINK_MAX_X - 25, tx));
    ty = Math.max(RINK_MIN_Y + 25, Math.min(RINK_MAX_Y - 25, ty));

    const dx = tx - p.x;
    const dy = ty - p.y;
    const aimDist = Math.hypot(dx, dy);
    
    if (aimDist < 1) return; 


    puck.lastOwnerId = p.id;
    ejectPuckFromOwner(p); 
    playGameSound('shoot_puck', 0.06);

    const dirX = dx / aimDist;
    const dirY = dy / aimDist;

    puck.vx = dirX * passSpeed;
    puck.vy = dirY * passSpeed;
    
    puckStealCooldown = 15;
    puck.isShot = false; // <--- SAFE TO CATCH

    // Stats tracking (unchanged)
    if (p.team === 0 && window.BT8_STATS) {
        window.BT8_STATS.attempts++;
    }
}



function tryStealPuck(attacker, owner) {
    // --- 1. GOALIE IMMUNITY ---
    if (owner.type === "goalie") return false;

    // --- 2. COOLDOWN CHECK ---
    if (puckStealCooldown > 0) return false;

    // --- 3. DISTANCE CHECK ---
    const dx = attacker.x - owner.x;
    const dy = attacker.y - owner.y;
    const dist2 = dx*dx + dy*dy;
    const stealDist = owner.size/2 + attacker.size/2 + 2; 

    if (dist2 < stealDist * stealDist) {
        
        // =========================================================
        // *** THE FIX: ANGLE OF ATTACK ***
        // =========================================================
        
        // 1. Calculate the vector from Owner -> Attacker
        const dist = Math.sqrt(dist2);
        const nx = dx / dist; // Normalized direction to attacker
        const ny = dy / dist;

        // 2. Get Owner's facing direction
        const ownerFaceX = Math.cos(owner.angle);
        const ownerFaceY = Math.sin(owner.angle);

        // 3. Dot Product
        // Result is 1.0 if attacker is directly IN FRONT
        // Result is -1.0 if attacker is directly BEHIND
        // Result is 0.0 if attacker is directly to the SIDE
        const alignment = (nx * ownerFaceX) + (ny * ownerFaceY);

        // 4. The "Check Your Six" Rule
        // If alignment is < 0, the attacker is behind the 90-degree plane of the carrier.
        // We set a threshold of -0.3 (roughly 110 degrees back).
        if (alignment < -0.3) {
            
            // "Stick Lift" Logic: 
            // Attempting to steal from behind is hard. 
            // Let's give it only a 10% chance of success.
            if (Math.random() > 0.10) {
                return false; // Steal failed (bumped from behind but kept puck)
            }
            
            // Optional: If you want to log it to verify it works
            // console.log("Rare stick lift from behind!");
        }

        // =========================================================

        // Successful Steal
        puck.ownerId = attacker.id;
        puck.vx = 0;
        puck.vy = 0;

        puckStealCooldown = 20; 
        return true;
    }

    return false;
}




// =========================================================
// PLAYER vs PLAYER COLLISIONS (TUNED & MOMENTUM BASED)
// =========================================================
function resolvePlayerCollisions() {
    for (let i = 0; i < players.length; i++) {
        for (let j = i + 1; j < players.length; j++) {
            const a = players[i];
            const b = players[j];

            const ar = a.size / 2;
            const br = b.size / 2;
            const minDist = ar + br;

            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const dist2 = dx*dx + dy*dy;

            if (dist2 < minDist * minDist && dist2 > 0) {
                const dist = Math.sqrt(dist2);
                
                // Normal Vector
                const nx = dx / dist;
                const ny = dy / dist;

                // --- 1. POSITIONAL CORRECTION ---
                const overlap = (minDist - dist) * 0.5;
                a.x -= nx * overlap;
                a.y -= ny * overlap;
                b.x += nx * overlap;
                b.y += ny * overlap;

                // --- 2. PHYSICS IMPULSE ---
                const rvx = b.vx - a.vx;
                const rvy = b.vy - a.vy;
                const velAlongNormal = rvx * nx + rvy * ny;

                if (velAlongNormal > 0) continue; // Moving apart

                const restitution = 0.9; 
                let jImpulse = -(1 + restitution) * velAlongNormal;
                jImpulse /= 2; 

                const impulseX = jImpulse * nx;
                const impulseY = jImpulse * ny;

                a.vx -= impulseX;
                a.vy -= impulseY;
                b.vx += impulseX;
                b.vy += impulseY;

                // --- 3. IMPACT & STUN LOGIC ---
                const impactForce = Math.abs(jImpulse);
                
                // *** MODIFIED: Only trigger stuns if it's an OPPONENT collision ***
                // We keep the force threshold at 1.50 for intentional hits.
                if (impactForce > 1.50 && a.team !== b.team) {
                    
                    // A. CALCULATE DYNAMIC STUN
                    let stunFrames = impactForce * 12;
                    
                    // Clamp limits (Min 15, Max 90)
                    if (stunFrames < 15) stunFrames = 15;
                    if (stunFrames > 90) stunFrames = 90;
                    stunFrames = Math.floor(stunFrames);

                    // B. DETERMINE "THE HAMMER"
                    const vA = a.vx * nx + a.vy * ny;
                    const vB = b.vx * (-nx) + b.vy * (-ny);

                    let victim = null;
                    if (vA > vB + 0.5) {
                        victim = b; 
                    } else if (vB > vA + 0.5) {
                        victim = a; 
                    } else {
                        victim = "BOTH"; 
                    }

                    // C. APPLY CONSEQUENCES
                    if (victim === "BOTH") {
                        applyStun(a, stunFrames, impactForce);
                        applyStun(b, stunFrames, impactForce);
                    } else if (victim) {
                        applyStun(victim, stunFrames, impactForce);
                    }
                }
            }
        }
    }
}

// Helper to apply stun and puck loss cleanly
function applyStun(p, frames, force) {
    p.stunTimer = frames;
    p.stunRot = (Math.random() < 0.4 ? 0.12 : -0.12); 

    // --- DROP STICK MECHANIC (Updated) ---
    if (force > 2.7 && !p.stickDropped) {
        // Call the Global Physics Spawner
        spawnDroppedStick(p);
    }

    // Puck Ejection (Unchanged)
    if (puck.ownerId === p.id) {
        ejectPuckFromOwner(p);
        const popScale = 1.0 + force * 1.5;
        puck.vx = p.vx + (Math.random() - 0.5) * popScale;
        puck.vy = p.vy + (Math.random() - 0.5) * popScale;
        puckStealCooldown = 25;
    }
}



function updateDroppedStickPhysics(p) {
    if (!p.stickDropped || !p.droppedStick) return;

    const s = p.droppedStick;

    // --- NEW: THE "SLIPPERY NET" FIX ---
    // If the stick is inside the net, gently push it out towards center ice.
    const leftNetX = Math.min(goal1, goal2);
    const rightNetX = Math.max(goal1, goal2);
    const netMouthY = 25; // Half-height of the net opening

    // 1. Check Left Net (Behind Goal Line + Between Posts)
    if (s.x < leftNetX && Math.abs(s.y - RY) < netMouthY) {
        s.vx += 0.15; // Push Right (Out of the net)
        s.vy += (Math.random() - 0.5) * 0.1; // Jiggle it slightly
    }

    // 2. Check Right Net (Behind Goal Line + Between Posts)
    else if (s.x > rightNetX && Math.abs(s.y - RY) < netMouthY) {
        s.vx -= 0.15; // Push Left (Out of the net)
        s.vy += (Math.random() - 0.5) * 0.1; 
    }
    // ------------------------------------

    // 1. Move
    s.x += s.vx;
    s.y += s.vy;
    s.angle += s.rotVel;

    // 2. Friction
    s.vx *= 0.94;
    s.vy *= 0.94;
    s.rotVel *= 0.94;

    // --- KEEP STICK INSIDE RINK (BOUNCE) ---
    const wallBuffer = 15; 
    const minX = (typeof RINK_MIN_X !== 'undefined' ? RINK_MIN_X : 100) + wallBuffer;
    const maxX = (typeof RINK_MAX_X !== 'undefined' ? RINK_MAX_X : 900) - wallBuffer;
    const minY = (typeof RINK_MIN_Y !== 'undefined' ? RINK_MIN_Y : 150) + wallBuffer;
    const maxY = (typeof RINK_MAX_Y !== 'undefined' ? RINK_MAX_Y : 490) - wallBuffer;

    // Bounce X
    if (s.x < minX) { 
        s.x = minX; 
        s.vx *= -0.6; 
        s.rotVel *= -1; 
    }
    if (s.x > maxX) { 
        s.x = maxX; 
        s.vx *= -0.6; 
        s.rotVel *= -1;
    }

    // Bounce Y
    if (s.y < minY) { 
        s.y = minY; 
        s.vy *= -0.6; 
        s.rotVel *= -1;
    }
    if (s.y > maxY) { 
        s.y = maxY; 
        s.vy *= -0.6; 
        s.rotVel *= -1;
    }

    // 3. Stop calculations if barely moving (Optimization)
    if (Math.abs(s.vx) < 0.01 && Math.abs(s.vy) < 0.01 && Math.abs(s.rotVel) < 0.001) {
        s.vx = 0;
        s.vy = 0;
        s.rotVel = 0;
    }
}



// =========================================================
// AI INPUT BUILDER (Phase 3)
// =========================================================
function buildAIInputs(p) {
    const inputs = [];

    // Normalize helpers
    const normX = 1 / W;
    const normY = 1 / H;
    const normV = 1 / 5;   // typical max velocity ~5

    // --- Self velocity ---
    inputs.push(p.vx * normV);
    inputs.push(p.vy * normV);

    // --- Puck relative position ---
    const dxp = puck.x - p.x;
    const dyp = puck.y - p.y;
    const dist_p = Math.hypot(dxp, dyp);

    inputs.push(dxp * normX);
    inputs.push(dyp * normY);
    inputs.push(dist_p * normX);   // normalized distance

    // --- Goals relative ---
    const attackGoalX = (p.team === 0) ? goal2 : goal1;
    const defendGoalX = (p.team === 0) ? goal1 : goal2;

    const dx_ag = attackGoalX - p.x;
    const dy_ag = RY - p.y;

    const dx_dg = defendGoalX - p.x;
    const dy_dg = RY - p.y;

    inputs.push(dx_ag * normX);
    inputs.push(dy_ag * normY);
    inputs.push(dx_dg * normX);
    inputs.push(dy_dg * normY);

    // --- Team puck state ---
    const owner = getPlayerById(puck.ownerId);
    const teammateHas = owner && owner.team === p.team ? 1 : 0;
    const opponentHas = owner && owner.team !== p.team ? 1 : 0;

    inputs.push(teammateHas);
    inputs.push(opponentHas);

    // --- Am I closest teammate to puck? ---
    let closest = true;
    for (const o of players) {
        if (o === p) continue;
        if (o.team !== p.team) continue;
        const d = Math.hypot(o.x - puck.x, o.y - puck.y);
        if (d < dist_p) {
            closest = false;
            break;
        }
    }
    inputs.push(closest ? 1 : 0);

    return inputs;
}



// =========================================================
// AI FORWARD PASS (Phase 3)
// =========================================================
function aiForwardPass(inputs, brain) {
    const { w1, b1, w2, b2 } = brain;

    // tanh activation
    const tanh = x => Math.tanh(x);

    // forward pass: input → hidden
    const hidden = w1.map((row, i) => {
        let sum = b1[i];
        for (let j = 0; j < row.length; j++) {
            sum += row[j] * inputs[j];
        }
        return tanh(sum);
    });

    // forward pass: hidden → output
    const outputs = w2.map((row, i) => {
        let sum = b2[i];
        for (let j = 0; j < row.length; j++) {
            sum += row[j] * hidden[j];
        }
        return tanh(sum);
    });

    // === EXPLORATION NOISE (PHASE 4.4) ===
    const epsilon = 0.2;  // exploration rate (20%)

    for (let i = 0; i < outputs.length; i++) {
        if (Math.random() < epsilon) {
            outputs[i] += (Math.random() * 2 - 1) * 0.5;
            outputs[i] = Math.max(-1, Math.min(1, outputs[i]));  // clamp to [-1, 1]
        }
    }

    return outputs;
}



function updateBrainWithReward(p, learningRate = 0.01) {
    const brain = p.brain;
    const reward = p.reward;

    if (!reward || reward === 0) return;

    function perturb(x, scale = 0.01) {
        return x + (Math.random() * 2 - 1) * scale;
    }

    function updateMatrix(m, scale) {
        for (let i = 0; i < m.length; i++) {
            for (let j = 0; j < m[i].length; j++) {
                m[i][j] += learningRate * reward * (Math.random() * 2 - 1) * scale;
            }
        }
    }

    function updateVector(v, scale) {
        for (let i = 0; i < v.length; i++) {
            v[i] += learningRate * reward * (Math.random() * 2 - 1) * scale;
        }
    }

    updateMatrix(brain.w1, 0.1);
    updateVector(brain.b1, 0.1);
    updateMatrix(brain.w2, 0.1);
    updateVector(brain.b2, 0.1);
}







// =========================================================
// NEURAL NETWORK SETUP (PHASE 4.1)
// =========================================================

function initPlayerBrain(p) {
    const inputSize = buildAIInputs(p).length;
    const hiddenSize = 8;
    const outputSize = 4;

    // Xavier Initialization (roughly)
    function randn(scale) {
        return (Math.random() * 2 - 1) * scale;
    }

    function randMatrix(rows, cols, scale) {
        const m = [];
        for (let i = 0; i < rows; i++) {
            const row = [];
            for (let j = 0; j < cols; j++) {
                row.push(randn(scale));
            }
            m.push(row);
        }
        return m;
    }

    function randVector(size, scale) {
        return Array.from({ length: size }, () => randn(scale));
    }

    const scale1 = Math.sqrt(1 / inputSize);
    const scale2 = Math.sqrt(1 / hiddenSize);

    p.brain.inputSize = inputSize;
    p.brain.hiddenSize = hiddenSize;
    p.brain.outputSize = outputSize;
    p.brain.w1 = randMatrix(hiddenSize, inputSize, scale1);
    p.brain.b1 = randVector(hiddenSize, scale1);
    p.brain.w2 = randMatrix(outputSize, hiddenSize, scale2);
    p.brain.b2 = randVector(outputSize, scale2);
}

// Call on all Team 0 skaters
for (const p of players) {
    if (p.team === 0 && p.type === "skater") {
        initPlayerBrain(p);
    }
}









// =========================================================
// PLAYER UPDATES
// =========================================================
function updateHumanSkater(p) {

    // --- DECREMENT COOLDOWNS ---
    if (p.shootCooldown > 0) p.shootCooldown--;
    if (p.passCooldown > 0) p.passCooldown--;

    // =========================================================
    // 1. STATUS CHECKS
    // =========================================================
    if (p.stunTimer > 0) {
        p.stunTimer--;
        p.vx *= 0.95; p.vy *= 0.95;
        p.x += p.vx; p.y += p.vy;
        p.angle += (p.stunRot || 0.2);
        p.visualBodyAngle = p.angle; 
        solveSkaterKinematics(p); 
        collideWithRink(p, p.size/2);
        return; 
    }

    if (p.stickDropped) {
        const myStick = droppedSticks.find(s => s.ownerId === p.id);
        if (myStick) {
            const dist = Math.hypot(p.x - myStick.x, p.y - myStick.y);
            if (dist < 20 && myStick.cooldown <= 0) {
                p.stickDropped = false;
                const idx = droppedSticks.indexOf(myStick);
                if (idx > -1) droppedSticks.splice(idx, 1);
            }
        }
    }

    // =========================================================
    // 2. SHOT ANIMATION (Triggered AFTER Release)
    // =========================================================
    if (p.isShooting) {
        p.shotTick++;
        
        // A. WIND UP (Frames 0-8)
        if (p.shotTick < 9) {
            p.pose.botX = 3.0; p.pose.rot = -25; p.pose.reach = 6.0;
        } 
        // B. FIRE (Frame 9)
        else if (p.shotTick === 9) {
            // Retrieve the power we calculated upon release
            const power = p.chargedShotPower || 12.0;
            
            // Manual Aiming (Straight ahead)
            const aimDist = 400;
            const targetX = p.x + Math.cos(p.angle) * aimDist;
            const targetY = p.y + Math.sin(p.angle) * aimDist;
            
            // Fire with calculated power
            shootPuck(p, power, { x: targetX, y: targetY }); 
        } 
        // C. FOLLOW THROUGH (Frames 10-20)
        else if (p.shotTick < 20) {
            p.pose.botX = 14.0; p.pose.rot = 15; p.pose.reach = 14.0;
        } 
        // D. END
        else {
            p.isShooting = false; p.shotTick = 0; p.chargedShotPower = 0;
        }
        
        // Drift Physics
        p.x += p.vx; p.y += p.vy;
        p.vx *= 0.98; p.vy *= 0.98;
        solveSkaterKinematics(p); 
        collideWithRink(p, p.size/2);
        return; 
    }

    // =========================================================
    // 3. MOVEMENT INPUTS
    // =========================================================
    const isBraking = keys.ArrowDown;
    const isPushing = keys.ArrowUp;
    const turnLeft  = keys.ArrowLeft;
    const turnRight = keys.ArrowRight;

    p.isAccelerating = isPushing;

    let turn = p.turnRate * (isBraking ? 2.5 : 1.2); 
    if (turnLeft)  p.angle -= turn;
    if (turnRight) p.angle += turn;

    if (isPushing) {
        const drive = p.baseDrive * p.energy;
        p.vx += Math.cos(p.angle) * drive;
        p.vy += Math.sin(p.angle) * drive;
    }

    if (isBraking) {
        p.vx *= 0.94; p.vy *= 0.94;
    } else {
        p.vx *= 0.992; p.vy *= 0.992;
        const speed = Math.hypot(p.vx, p.vy);
        if (speed > 0.1) {
            const moveAng = Math.atan2(p.vy, p.vx);
            const faceAng = p.angle;
            const grip = 0.15; 
            const newAng = moveAng + normalizeAngle(faceAng - moveAng) * grip;
            p.vx = Math.cos(newAng) * speed;
            p.vy = Math.sin(newAng) * speed;
        }
    }

    const sp = Math.hypot(p.vx, p.vy);
    if (sp > p.maxSpeed) {
        const s = p.maxSpeed / sp;
        p.vx *= s; p.vy *= s;
    }

    p.x += p.vx; p.y += p.vy;
    collideWithRink(p, p.size/2);

    // =========================================================
    // 4. CONTROL LOGIC (Charge & Release)
    // =========================================================
    
    // Config: Thresholds
    const PASS_MAX_FRAMES = 25;  // 0-25 frames = Pass
    const SHOT_MAX_FRAMES = 60;  // 26-60 frames = Shot Scaling

    // Config: Power Output
    const PASS_MIN_SPEED = 4.0;
    const PASS_MAX_SPEED = 9.0;
    const SHOT_MIN_POWER = 11.0;
    const SHOT_MAX_POWER = 24.0; // Hardest possible shot

    if (typeof p.controlHoldTimer === 'undefined') p.controlHoldTimer = 0;

    // Only allow input if we have the puck and stick
    if (!p.stickDropped && puck.ownerId === p.id) {
        
        if (keys.Control) {
            // --- CHARGING (Invisible) ---
            p.controlHoldTimer++;
            // We do NOTHING visual here. Just counting.
        } 
        else {
            // --- RELEASED! EXECUTE ACTION ---
            if (p.controlHoldTimer > 0) {
                
                // === ACTION A: PASS (Short Hold) ===
                if (p.controlHoldTimer <= PASS_MAX_FRAMES) {
                    if (p.passCooldown <= 0) {
                        // Calculate Pass Speed (0.0 to 1.0 based on hold time)
                        let pct = p.controlHoldTimer / PASS_MAX_FRAMES; 
                        let finalSpeed = PASS_MIN_SPEED + (pct * (PASS_MAX_SPEED - PASS_MIN_SPEED));
                        
                        // Execute Directional Pass
                        puck.lastOwnerId = p.id;
                        ejectPuckFromOwner(p); 
                        puck.vx = Math.cos(p.angle) * finalSpeed;
                        puck.vy = Math.sin(p.angle) * finalSpeed;
                        puck.pickupImmunityUntil = performance.now() + 500; 
                        puck.isShot = false; 
                        p.passCooldown = 30;
                    }
                }
                // === ACTION B: SHOT (Long Hold) ===
                else {
                    if (p.shootCooldown <= 0) {
                        // Calculate Shot Power
                        let charge = (p.controlHoldTimer - PASS_MAX_FRAMES) / (SHOT_MAX_FRAMES - PASS_MAX_FRAMES);
                        if (charge > 1.0) charge = 1.0; // Cap at max
                        
                        // Store calculated power for the animation to use
                        p.chargedShotPower = SHOT_MIN_POWER + (charge * (SHOT_MAX_POWER - SHOT_MIN_POWER));

                        // START ANIMATION NOW
                        p.isShooting = true;
                        p.shotTick = 0;
                    }
                }
                
                // Reset timer
                p.controlHoldTimer = 0;
            }
        }
    } 
    else {
        // Lost puck? Reset timer
        p.controlHoldTimer = 0;
    }

    // =========================================================
    // 5. OTHER ACTIONS
    // =========================================================
    tryPickupPuck(p);

    if (puck.ownerId !== null && puck.ownerId !== p.id) {
        const owner = getPlayerById(puck.ownerId);
        if (owner && owner.team !== p.team) {
            if (!goalieLocked) tryStealPuck(p, owner);
        }
    }

    // =========================================================
    // 6. ANIMATION SYNC
    // =========================================================
    // Only update pose if we are NOT shooting (normal skating/dribbling)
    if (!p.isShooting) {
        p.visualBodyAngle = p.angle;
        let targetPose = { botX: 6.4, botY: 2.55, rot: 0, reach: 6.4 };
        p.pose.botX += (targetPose.botX - p.pose.botX) * 0.2;
        p.pose.botY += (targetPose.botY - p.pose.botY) * 0.2;
        p.pose.rot  += (targetPose.rot - p.pose.rot) * 0.1;
        p.pose.reach += (targetPose.reach - p.pose.reach) * 0.2;

        if (!p.stickDropped) applyStickHandling(p);
    }
    
    // Always solve constraints
    solveSkaterKinematics(p);
    
    // Sync Puck
    if (puck.ownerId === p.id) {
        let px = p.cradlePos.x;
        let py = p.cradlePos.y;
        if (p.dribbleLag) {
            const lagX = Math.cos(p.currentStickAngle + Math.PI/2) * p.dribbleLag;
            const lagY = Math.sin(p.currentStickAngle + Math.PI/2) * p.dribbleLag;
            px += lagX; py += lagY;
        }
        puck.x = px; puck.y = py;
        puck.vx = p.vx; puck.vy = p.vy;
    }
}



function performDirectionalPass(p) {
    if (puck.ownerId !== p.id) return;

    // 1. Release the puck
    puck.lastOwnerId = p.id;
    ejectPuckFromOwner(p); 

    // 2. Apply Velocity directly from Facing Angle
    // No target coordinates needed. Just Angle + Speed.
    const passSpeed = 5.5; // Nice crisp pass speed
    
    puck.vx = Math.cos(p.angle) * passSpeed;
    puck.vy = Math.sin(p.angle) * passSpeed;
    
    // 3. Set State
    puckStealCooldown = 15; // Brief immunity so you don't steal your own pass
    puck.isShot = false;    // Mark as pass (easier for teammates to catch)
    puck.passTargetId = null; 
    
    // Stats (Optional)
    if (p.team === 0 && window.BT8_STATS) {
        window.BT8_STATS.attempts++;
    }
}



function isClosestTeammateToPuck(p) {
    const dp = Math.hypot(puck.x - p.x, puck.y - p.y);

    for (const o of players) {
        if (o.team !== p.team) continue;
        if (o === p) continue;

        const d = Math.hypot(puck.x - o.x, puck.y - o.y);
        if (d < dp) return false;
    }
    return true;
}


// ============================================================================
// =========================== AI DECISION MODEL ==============================
// ============================================================================
//
// Each skater evaluates behaviour in this order:
// 1. If I have puck → decideWithPuck()
// 2. If teammate has puck → supportTeammate()
// 3. If opponent has puck → defendAgainstOpponent()
// 4. If puck is loose → chaseLoosePuck()
//
// Each decision function returns:
//   { tx: number, ty: number, action: "none"|"shoot"|"pass", target: player|null }
//
// updateAISkater() will then steer toward tx, ty and perform the action.
// ============================================================================



// ---------------------------------------------------------------------------
// ROLE SYSTEM HELPERS (MUST BE ABOVE think(p))
// ---------------------------------------------------------------------------





function assignRolesForTeam(team) {
    const myGoalX = (team === 0) ? goal1 : goal2;

    // Filter and sort skaters by distance to own net
    // (Closest to net becomes the Defender)
    const skaters = players.filter(p => p.team === team && p.type === "skater");
    skaters.sort((a,b) => Math.abs(a.x - myGoalX) - Math.abs(b.x - myGoalX));

    // Reset biases
    skaters.forEach(p => p.laneBias = 0);

    // ===================================
    // TEAM 0 - Uses A, B, C
    // ===================================
    if (team === 0) {
        // Safe check to ensure we have enough players
        if (skaters[0]) skaters[0].role = "A"; // Defender
        if (skaters[1]) skaters[1].role = "B"; // Center/High Point
        if (skaters[2]) skaters[2].role = "C"; // Winger/Low Point
        
        // 4th/5th players act as generic forwards (C)
        if (skaters[3]) skaters[3].role = "C";
        if (skaters[4]) skaters[4].role = "C";
    }
    
    // ===================================
    // TEAM 1 - Uses S, P, D
    // ===================================
    else if (team === 1) {
        // Note: For Team 1, our logic expects:
        // S = Sniper
        // P = Playmaker
        // D = Defender
        
        // Based on distance sort (0 is closest to goal)
        if (skaters[0]) skaters[0].role = "S"; // Top Circle
        if (skaters[1]) skaters[1].role = "P"; // Bottom Circle
        if (skaters[2]) skaters[2].role = "D"; // Defender (Point)
        
        // If we have extra players, make them Playmakers
        if (skaters[3]) skaters[3].role = "P";
        if (skaters[4]) skaters[4].role = "S";
    }
}



function getTeamRoles(team) {
    const myGoalX = (team === 0) ? goal1 : goal2;
    let arr = players.filter(p => p.team === team && p.type === "skater");
    arr.sort((a,b) => Math.abs(a.x - myGoalX) - Math.abs(b.x - myGoalX));
    return { closest: arr[0], middle: arr[1], farthest: arr[2] };
}

function roleA_goalieProtector(p) {
    const gx = (p.team === 0) ? goal1 : goal2;
    const gy = RY;
    let opp = null, best = 999999;
    for (const o of players) {
        if (o.team === p.team) continue;
        const d = Math.hypot(o.x - p.x, o.y - p.y);
        if (d < best) { best = d; opp = o; }
    }
    const bx = (opp.x + gx) / 2;
    const by = (opp.y + gy) / 2;
    return { tx: bx, ty: by, action:"none" };
}

function roleB_attack(p) {
    const gx = (p.team === 0) ? goal2 : goal1;
    return { tx: gx, ty: RY, action:"none" };
}

function roleB_pressureCarrier(p, carrier) {
    return { tx: carrier.x, ty: carrier.y, action:"none" };
}

function roleB_loosePuck(p) {
    return { tx: puck.x, ty: puck.y, action:"none" };
}

function roleC_supportOffense(p) {
    const gx = (p.team === 0) ? goal2 : goal1;
    return { tx: gx, ty: RY, action:"none" };
}

function roleC_supportDefense(p) {
    const gx = (p.team === 0) ? goal1 : goal2;
    return { tx: gx, ty: RY, action:"none" };
}

function roleC_loosePuck(p) {
    return { tx: puck.x, ty: puck.y, action:"none" };
}




function solveBehindNet(p) {
    const goalX = (p.team === 0) ? goal2 : goal1;
    
    // Determine Attack Direction based on where the goal is
    // If goalX is > Center (Right Side), we are Attacking Right.
    // If goalX is < Center (Left Side), we are Attacking Left.
    const attackingRight = (goalX > RX);

    // 1. DEFINE "BEHIND"
    // If attacking Right, Behind is X > Goal.
    // If attacking Left, Behind is X < Goal.
    let isBehind = false;
    const buffer = 15;
    
    if (attackingRight) {
        if (p.x > goalX - buffer) isBehind = true;
    } else {
        if (p.x < goalX + buffer) isBehind = true;
    }
    
    if (!isBehind) return null; // We are in front, let normal logic run

    // 2. LOOK FOR SLOT PASS
    // Slot is always "In Front" of the goal (Back towards Center)
    const slotOffset = attackingRight ? -150 : 150;
    const slotX = goalX + slotOffset;
    
    for (const mate of players) {
        if (mate.team !== p.team || mate.id === p.id) continue;
        const distToSlot = Math.hypot(mate.x - slotX, mate.y - RY);
        if (distToSlot < 100) {
            if (!isLaneBlocked(p.x, p.y, mate.x, mate.y, p.team)) {
                return { tx: mate.x, ty: mate.y, action: "pass", target: mate };
            }
        }
    }

    // 3. MOVEMENT: CURL OUT TO THE NEAREST CIRCLE
    // If we are Top (y < RY), go to Top Circle. If Bottom, go Bottom.
    const isTop = (p.y < RY);
    
    // Safe Spot must be "In Front" of the goal line (Towards Center Ice)
    // If attacking Right, "Front" is Left (-).
    // If attacking Left, "Front" is Right (+).
    const safeOffset = attackingRight ? -100 : 100;
    const safeX = goalX + safeOffset;
    const safeY = isTop ? (RY - 90) : (RY + 90);

    return { tx: safeX, ty: safeY, action: "none" };
}


















// ============================================================================
// Team 0 BEHAVIOUR: WITH PUCK
// ============================================================================
function decideWithPuck(p) {

    const goalX = (p.team === 0) ? goal2 : goal1;
    const goalY = (topY + botY) / 2;

    // === COOLDOWN CHECK ===
    if (p.shootCooldown > 0) {
        const lane = pickCarryLane(p);
        return { tx: lane.x, ty: lane.y, action: "none", target: null };
    }

    // =====================================================
    // 1. Evaluate shot
    // =====================================================
    const shoot = evaluateShot(p);

    // === BREAKAWAY OVERRIDE ===
    if (shootReason === "BREAKAWAY → GOOD") {

        // Face target
        p.angle = Math.atan2(shoot.y - p.y, shoot.x - p.x);

        // --- Prevent illegal back-net shots ---
        const redirect = redirectShotBehindNet(p);
        if (redirect) {

            // Force shot angle toward redirected direction
            p.angle = Math.atan2(redirect.y - p.y, redirect.x - p.x);

            return {
                tx: redirect.x,
                ty: redirect.y,
                action: "shoot",
                target: null
            };
        }

        // Normal breakaway shot
        return {
            tx: shoot.x,
            ty: shoot.y,
            action: "shoot",
            target: null
        };
    }

    // === NORMAL SHOOT CHECK ===
    if (shoot.good && !isLaneBlocked(p.x, p.y, shoot.x, shoot.y, p.team)) {

        // Face goal before shooting
        p.angle = Math.atan2(shoot.y - p.y, shoot.x - p.x);

        // --- Prevent illegal back-net shots ---
        const redirect = redirectShotBehindNet(p);
        if (redirect) {

            // Force shot angle toward redirected direction
            p.angle = Math.atan2(redirect.y - p.y, redirect.x - p.x);
            
            return {
                tx: redirect.x,
                ty: redirect.y,
                action: "shoot",
                target: null
            };
        }

        // Normal shot
        return {
            tx: shoot.x,
            ty: shoot.y,
            action: "shoot",
            target: null
        };
    }

    // =====================================================
    // 2. Evaluate pass options
    // =====================================================
    const pass = evaluatePassOptions(p);

    if (pass.good) {

        const pressured = isPressured(p);
        const clearLane = !isLaneBlocked(
            p.x, p.y,
            pass.teammate.x, pass.teammate.y,
            p.team
        );

        if (clearLane || pressured) {
            return {
                tx: pass.teammate.x,
                ty: pass.teammate.y,
                action: "pass",
                target: pass.teammate
            };
        }
    }

    // =====================================================
    // 3. Carry puck toward best lane
    // =====================================================
    const lane = pickCarryLane(p);

    return {
        tx: lane.x,
        ty: lane.y,
        action: "none",
        target: null
    };
}












// ============================================================================
// BEHAVIOUR: SUPPORT TEAMMATE WITH PUCK
// ============================================================================
function supportTeammate(p, owner) {

    // How far behind/sideways to be
    const followDist = 70;     // lateral spacing
    const trailDist  = 90;     // trailing support
    
    // Calculate trailing point (behind puck carrier)
    const trailAngle = owner.angle + Math.PI;   // directly behind
    const trailX = owner.x + Math.cos(trailAngle) * trailDist;
    const trailY = owner.y + Math.sin(trailAngle) * trailDist;

    // Calculate lateral point (left/right of puck carrier)
    const leftAngle  = owner.angle + Math.PI/2;
    const rightAngle = owner.angle - Math.PI/2;

    const leftX  = owner.x + Math.cos(leftAngle) * followDist;
    const leftY  = owner.y + Math.sin(leftAngle) * followDist;

    const rightX = owner.x + Math.cos(rightAngle) * followDist;
    const rightY = owner.y + Math.sin(rightAngle) * followDist;

    // Score both lateral sides for openness
    const leftScore  = openSpaceScore(leftX, leftY, p.team);
    const rightScore = openSpaceScore(rightX, rightY, p.team);

    // Choose best position: trail vs left vs right
    let bestX = trailX;
    let bestY = trailY;
    let bestScore = openSpaceScore(trailX, trailY, p.team);

    if (leftScore > bestScore) {
        bestScore = leftScore;
        bestX = leftX;
        bestY = leftY;
    }
    if (rightScore > bestScore) {
        bestScore = rightScore;
        bestX = rightX;
        bestY = rightY;
    }

    return {
        tx: bestX,
        ty: bestY,
        action: "none",
        target: null
    };
}




// ============================================================================
// BEHAVIOUR: DEFEND AGAINST OPPONENT
// ============================================================================
function defendAgainstOpponent(p, owner) {

    const carrier = owner;

    // ----------------------------------------------------------
    // 1. SLOT PROTECTION (default defensive position)
    // ----------------------------------------------------------
    const slotX = (p.team === 0) ? goal1 + 120 : goal2 - 120;
    const slotY = RY;

    // distance from defender to slot
    const distSlot = Math.hypot(p.x - slotX, p.y - slotY);

    // if defender is way out of position → go home first
    if (distSlot > 180) {
        return {
            tx: slotX,
            ty: slotY,
            action: "none"
        };
    }

    // ----------------------------------------------------------
    // 2. CLOSEST DEFENDER → pressure puck carrier
    // ----------------------------------------------------------
    if (isClosestTeammateToTarget(p, carrier)) {

        const dx = carrier.x - p.x;
        const dy = carrier.y - p.y;
        const dist = Math.hypot(dx, dy);

        const idealGap = 110;  // distance you want to maintain

        // too far away → close the gap
        if (dist > idealGap + 40) {
            return {
                tx: carrier.x,
                ty: carrier.y,
                action: "none"
            };
        }

        // too close → back up toward your own net (maintain gap)
        if (dist < idealGap - 40) {
            const retreatX = (p.team === 0) ? goal1 + 60 : goal2 - 60;
            return {
                tx: retreatX,
                ty: p.y,       // same vertical line
                action: "none"
            };
        }

        // ideal gap → shadow the carrier
        return {
            tx: carrier.x - (dx / dist) * idealGap,
            ty: carrier.y - (dy / dist) * idealGap,
            action: "none"
        };
    }

    // ----------------------------------------------------------
    // 3. NOT CLOSEST → block passing lanes
    // ----------------------------------------------------------
    // find the teammate the carrier wants to pass to
    const mate = findBestPassTargetFor(opponentTeam = carrier.team);

    if (mate) {
        // midpoint between carrier and his passing target
        const midX = (carrier.x + mate.x) / 2;
        const midY = (carrier.y + mate.y) / 2;

        return {
            tx: midX,
            ty: midY,
            action: "none"
        };
    }

    // ----------------------------------------------------------
    // 4. fallback = slot protection
    // ----------------------------------------------------------
    return {
        tx: slotX,
        ty: slotY,
        action: "none"
    };
}




// ============================================================================
// BEHAVIOUR: LOOSE PUCK
// ============================================================================
function chaseLoosePuck(p) {

    // closest teammate → chase directly
    if (isClosestTeammateToTarget(p, puck)) {
        return {
            tx: puck.x,
            ty: puck.y,
            action: "none"
        };
    }

    // others → support angle behind closest chaser
    const support = findLoosePuckSupportPosition(p);
    return {
        tx: support.x,
        ty: support.y,
        action: "none"
    };
}

// Check if this skater is closest teammate to a given target
function isClosestTeammateToTarget(p, target) {
    const myDist = Math.hypot(p.x - target.x, p.y - target.y);

    for (const o of players) {
        if (o.team !== p.team) continue;
        if (o === p) continue;

        const d = Math.hypot(o.x - target.x, o.y - target.y);
        if (d < myDist) return false;
    }

    return true;
}



// =========================================================
// DROPPED STICK PHYSICS ENGINE
// =========================================================

function spawnDroppedStick(p) {
    if (!p) return;

    // 1. Determine Start Position
    let startX = p.x, startY = p.y, startAng = p.angle;
    if (p.bladePos) {
        startX = p.bladePos.x;
        startY = p.bladePos.y;
        startAng = p.currentStickAngle;
    }

    // 2. Initialize "Accident" Physics
    const slideSpeed = 1.5 + Math.random() * 1.5; 
    const slideDir = Math.random() * Math.PI * 2;

    const stick = {
        x: startX,
        y: startY,
        angle: startAng,
        
        vx: Math.cos(slideDir) * slideSpeed,
        vy: Math.sin(slideDir) * slideSpeed,
        vRot: (Math.random() - 0.2) * 0.05,
        
        ownerId: p.id,       
        handing: p.handing,  
        team: p.team,
        color: (p.team === 0) ? TEAM0_COLOR_HAS_PUCK : TEAM1_COLOR_HAS_PUCK,
        
        cooldown: 60,
        
        // *** NEW: MAGIC RETURN TIMER ***
        // 60 frames = 1 second. 300 = 5 seconds.
        // Change this number to adjust how long the stick stays on the ice.
        returnTimer: 420 
    };

    // 3. Push to global array
    droppedSticks.push(stick);
    
    // Update Player State
    p.stickDropped = true;
    p.droppedStick = null; 
}


function updateDroppedSticks() {
    for (let i = droppedSticks.length - 1; i >= 0; i--) {
        const s = droppedSticks[i];

        // --- NEW: MAGIC RETURN LOGIC ---
        if (s.returnTimer > 0) {
            s.returnTimer--;
        } else {
            // Timer expired! Magically return to owner.
            const owner = getPlayerById(s.ownerId);
            if (owner) {
                owner.stickDropped = false;
                owner.droppedStick = null;
            }
            // Remove from ice
            droppedSticks.splice(i, 1);
            continue; // Skip physics for this deleted stick
        }
        // -------------------------------

        // 1. PHYSICS INTEGRATION
        s.x += s.vx;
        s.y += s.vy;
        s.angle += s.vRot;

        // 2. FRICTION
        s.vx *= STICK_PHYSICS.friction;
        s.vy *= STICK_PHYSICS.friction;
        s.vRot *= STICK_PHYSICS.rotFriction;

        // 3. WALL COLLISIONS
        if (s.x < RINK_MIN_X || s.x > RINK_MAX_X) {
            s.vx *= -0.6;
            s.x = (s.x < RINK_MIN_X) ? RINK_MIN_X + 2 : RINK_MAX_X - 2;
            s.vRot += (Math.random() - 0.5) * 0.2;
        }
        if (s.y < RINK_MIN_Y || s.y > RINK_MAX_Y) {
            s.vy *= -0.6;
            s.y = (s.y < RINK_MIN_Y) ? RINK_MIN_Y + 2 : RINK_MAX_Y - 2;
            s.vRot += (Math.random() - 0.5) * 0.2;
        }

        // 4. INTERACTION COOLDOWN
        if (s.cooldown > 0) s.cooldown--;

        // 5. COLLISIONS
        resolveStickInteractions(s, i);
    }
}




function resolveStickInteractions(s, index) {
    // Defines the stick as a geometric Oriented Bounding Box (OBB)
    // We approximate it as a line segment for collision checks to save CPU
    // The segment runs from "Handle" to "Blade" through the COG.
    
    const halfLen = STICK_PHYSICS.length / 2;
    const offset = STICK_PHYSICS.cogOffset; // The balance shift
    
    const cos = Math.cos(s.angle);
    const sin = Math.sin(s.angle);
    
    // Calculate endpoints relative to COG (s.x, s.y)
    // Handle is the "Light" end (farther from COG)
    // Blade is the "Heavy" end (closer to COG)
    const handleX = s.x - (cos * (halfLen + offset));
    const handleY = s.y - (sin * (halfLen + offset));
    
    const bladeX = s.x + (cos * (halfLen - offset));
    const bladeY = s.y + (sin * (halfLen - offset));

    // --- A. PUCK DEFLECTION ---
    // Distance from Puck Center to Stick Segment
    const pd = pointLineDistance(puck.x, puck.y, handleX, handleY, bladeX, bladeY);
    
    if (pd < puck.r + STICK_PHYSICS.width) {
        // HIT!
        
        // 1. Bounce the Puck
        // Simple reflection logic
        const dx = bladeX - handleX;
        const dy = bladeY - handleY;
        const normalX = -dy; 
        const normalY = dx;
        const len = Math.hypot(normalX, normalY);
        const nx = normalX / len;
        const ny = normalY / len;
        
        // Reflect velocity
        const dot = puck.vx * nx + puck.vy * ny;
        puck.vx = puck.vx - 2 * dot * nx;
        puck.vy = puck.vy - 2 * dot * ny;
        
        // Push out
        puck.x += nx * 2;
        puck.y += ny * 2;

        // 2. Move the Stick (Newton's 3rd Law)
        // Puck hits stick -> stick should spin/move
        s.vx += -nx * 0.5;
        s.vy += -ny * 0.5;
        s.vRot += (Math.random() - 0.5) * 0.3; // Chaos spin
        
        // Force ownership loss if someone was holding it
        if (puck.ownerId !== null) {
            // Check if owner is NOT the person who dropped this stick
            // (Optional: Prevent self-tripping instantly)
            ejectPuckFromOwner(getPlayerById(puck.ownerId));
        }
    }

    // --- B. PLAYER KICKING / RETRIEVAL ---
    for (const p of players) {
        // Distance check (Circle vs Line Segment)
        const d = pointLineDistance(p.x, p.y, handleX, handleY, bladeX, bladeY);
        
        if (d < p.size/2 + STICK_PHYSICS.width) {
            
            // 1. RETRIEVAL (Must be empty handed, same team, cooldown over)
            if (p.stickDropped && p.team === s.team && s.cooldown <= 0) {
                 // PICK UP!
                 p.stickDropped = false;
                 droppedSticks.splice(index, 1);
                 return; // Object destroyed, stop processing
            }

            // 2. KICKING IT (Physical collision)
            // If I skate into it, I kick it away.
            const kickPower = Math.hypot(p.vx, p.vy);
            
            if (kickPower > 0.1) {
                // Determine where we hit the stick (Handle vs Blade)
                const distToCOG = Math.hypot(p.x - s.x, p.y - s.y);
                const isKickNearCenter = distToCOG < 10;
                
                // --- HEAVY STICK TUNING ---
                // WAS: 0.8 (Featherweight) -> NOW: 0.3 (Heavy)
                // This means the stick only accepts 30% of the kick velocity.
                const weightFactor = 0.3; 

                // Linear Impulse (Move away from player)
                const kx = p.vx * weightFactor;
                const ky = p.vy * weightFactor;
                s.vx += kx;
                s.vy += ky;
                
                // Angular Impulse (Spin)
                // Reduced spin multiplier from 0.3 to 0.1 so it doesn't helicopter wildy
                if (!isKickNearCenter) {
                    s.vRot += (Math.random() < 0.5 ? 0.1 : -0.1) * kickPower;
                }
            }
        }
    }
}

// Updated to accept an optional array (defaults to the live global list)
function drawDroppedSticks(stickList = droppedSticks) {
    for (const s of stickList) {
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.angle);

        // 1. Draw Shaft
        ctx.strokeStyle = "#5d4037";
        ctx.lineWidth = 1.3 * SKATER_SCALE; 
        ctx.beginPath();
        ctx.moveTo(-19, 0);     
        ctx.lineTo(0, 0);     
        ctx.stroke();

        // 2. Draw Blade
        ctx.save();
        const curveDir = s.handing || 1; 
        ctx.rotate(1.0 * curveDir); 

        ctx.fillStyle = "black"; 
        ctx.fillRect(0, -0.95, 5.5, 1.9); 
        
        ctx.restore(); 
        ctx.restore();
    }
}

// Helper: Shortest distance from point P to line segment AB
function pointLineDistance(px, py, ax, ay, bx, by) {
    const l2 = (bx - ax) * (bx - ax) + (by - ay) * (by - ay);
    if (l2 === 0) return Math.hypot(px - ax, py - ay);
    let t = ((px - ax) * (bx - ax) + (py - ay) * (by - ay)) / l2;
    t = Math.max(0, Math.min(1, t));
    const distSq = (px - (ax + t * (bx - ax))) ** 2 + (py - (ay + t * (by - ay))) ** 2;
    return Math.sqrt(distSq);
}





function findBestPassTargetFor(team) {
    let best = null;
    let bestScore = -999999;

    for (const p of players) {
        if (p.team !== team) continue;     // only that team
        if (p.type !== "skater") continue; // ignore goalie

        // Simple scoring:
        // farther from puck carrier = better passing target
        // more open = better
        const dx = puck.x - p.x;
        const dy = puck.y - p.y;
        const dist = Math.hypot(dx, dy);

        let score = dist;

        // open-space bonus (not near defenders)
        let open = 0;
        for (const o of players) {
            if (o.team === team) continue;
            const d2 = Math.hypot(o.x - p.x, o.y - p.y);
            if (d2 < 100) open -= (100 - d2);  // losing openness
        }
        score += open * 0.5;

        if (score > bestScore) {
            bestScore = score;
            best = p;
        }
    }

    return best;
}






// =========================================================
// GOALIE AI HELPERS
// =========================================================
function findGoaliePassTarget(goalie) {
    let bestTarget = null;
    let bestScore = -999;

    const weAttackRight = (goalie.team === 0) ? team0AttacksRight : !team0AttacksRight;
    const forwardDir = weAttackRight ? 1 : -1;

    for (const mate of players) {
        if (mate.team !== goalie.team || mate.id === goalie.id || mate.type !== "skater") continue;

        let score = 0;

        // A. DISTANCE
        const dist = Math.hypot(mate.x - goalie.x, mate.y - goalie.y);
        if (dist < 60) score -= 20; // Don't pass to someone in your face
        if (dist > 450) score -= 10; 

        // B. POSITIONING (Wide is safe)
        const distFromCenterY = Math.abs(mate.y - RY);
        if (distFromCenterY > 100) score += 10; 
        
        // C. FORWARD PROGRESS
        const relativeX = (mate.x - goalie.x) * forwardDir;
        if (relativeX < 10) continue; // VETO: Don't pass behind or parallel

        // D. OPPONENT PRESSURE (STRICTER)
        let isSafe = true;
        for (const opp of players) {
            if (opp.team === goalie.team) continue;
            
            // Is opponent breathing on the receiver?
            const dToMate = Math.hypot(opp.x - mate.x, opp.y - mate.y);
            if (dToMate < 60) { score -= 50; }

            // Is opponent blocking the lane?
            const distToLane = pointLineDistance(goalie.x, goalie.y, mate.x, mate.y, opp.x, opp.y);
            if (distToLane < 30) { // 30px width check
                const dGoalieToOpp = Math.hypot(opp.x - goalie.x, opp.y - goalie.y);
                // Only matters if opponent is closer than the teammate
                if (dGoalieToOpp < dist) {
                    isSafe = false; 
                    break; // Blocked.
                }
            }
        }

        if (!isSafe) continue; // Skip this target

        if (score > bestScore) {
            bestScore = score;
            bestTarget = mate;
        }
    }

    return (bestScore > -10) ? bestTarget : null;
}

function findOpenIce(p) {

        y: Math.sin(angle) * 60
    };
}

function findOpenIceScore(p) {
    let score = 0;

    for (const o of players) {
        if (o.team !== p.team) continue;
        const d = Math.hypot(o.x - p.x, o.y - p.y);
        if (d < 50) score -= 2;   // too close to teammate
    }

    return score;
}

function isPressured(p) {
    for (const o of players) {
        if (o.team === p.team) continue;
        const d = Math.hypot(o.x - p.x, o.y - p.y);
        if (d < 50) return true;
    }
    return false;
}

function chooseCarryLane(p) {

}

function findInterceptionPoint(me, owner) {

}

function findLoosePuckSupportPosition(p) {

    };
}


function defendsLeft(team) {
