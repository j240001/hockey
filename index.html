function updateAISkater(p) {

    // Animate the stick if it's on the ice
    
    
    // 1. STUN & STICK FETCH CHECK
    if (p.stunTimer > 0) {
        // --- STUNNED BEHAVIOR ---
        p.stunTimer--;
        p.vx *= 0.95; 
        p.vy *= 0.95;
        p.x += p.vx; 
        p.y += p.vy;
        
        // Spin the physics angle
        p.angle += (p.stunRot || 0.2); 
        
        // SYNC VISUAL ANGLE (The Fix)
        p.visualBodyAngle = p.angle; 

        collideWithRink(p, p.size/2);
        
        // Update kinematics so the arms/stick spin with the body
        solveSkaterKinematics(p);
        
        // Exit early so they don't try to play hockey while stunned
        return; 
    }

    // 2. Decrement Cooldowns
    if (p.shootCooldown > 0) p.shootCooldown--;
    if (p.passCooldown > 0) p.passCooldown--;

    // =========================================================
    // 3. AI STRATEGY (WITH STICK RECOVERY OVERRIDE)
    // =========================================================
    // --- FETCH STICK MODE ---
    // 1. Find my stick in the global world
    let myStick = null;
    if (p.stickDropped) {
        myStick = droppedSticks.find(s => s.ownerId === p.id);
    }

    if (p.stickDropped && myStick) {
        // A. Set Target to the Stick
        d = { tx: myStick.x, ty: myStick.y, action: "none" };
        
        // B. Check for Pickup
        const distToStick = Math.hypot(p.x - myStick.x, p.y - myStick.y);
        
        // C. PICKUP LOGIC (Using the array index)
        if (distToStick < 15 && myStick.cooldown <= 0) {
            p.stickDropped = false;
            
            // Remove from world
            const idx = droppedSticks.indexOf(myStick);
            if (idx > -1) droppedSticks.splice(idx, 1);
        }
    }
    // --- NORMAL HOCKEY MODE ---
    else {
        const activeStrategy = (p.team === 0) ? Team0_Strategy : Team1_Strategy;
        if (activeStrategy) {
            d = activeStrategy.think(p);
        } else {
            d = { tx: p.x, ty: p.y, action: "none" };
        }
    }

 // =========================================================
    // *** BRAIN STEM OVERRIDE: ANTI-CAMPING & DELAYED OFFSIDE ***
    // =========================================================
    
    const isDelayed = (typeof offsideState !== 'undefined' && offsideState.active && offsideState.team === p.team);
    let isCamping = false;
    
    // Only check camping if I don't have the puck
    if (puck.ownerId !== p.id) {
        const blueLineOffset = 110; 
        const rightLine = RX + blueLineOffset;
        const leftLine  = RX - blueLineOffset;
        const attackingRight = (p.team === 0) ? team0AttacksRight : !team0AttacksRight;

        if (attackingRight) {
            // I am deep (Right of line) BUT puck is shallow (Left of line)
            if (p.x > rightLine && puck.x <= rightLine) isCamping = true;
        } else {
            // I am deep (Left of line) BUT puck is shallow (Right of line)
            if (p.x < leftLine && puck.x >= leftLine) isCamping = true;
        }
    }

    // IF OFFSIDE OR CAMPING -> FORCE RETREAT
    // *** FIX: IGNORE RULES IF RETRIEVING STICK ***
    // We only force them out if they actually have their stick. 
    // If they dropped it, let them go get it (even if it's offside).
    if ((isDelayed || isCamping) && !p.stickDropped) {
        const attackingRight = (p.team === 0) ? team0AttacksRight : !team0AttacksRight;
        const dir = attackingRight ? 1 : -1;
        
        // Target: Center Ice side of the blue line
        d.tx = RX + (dir * 50);   
        d.ty = RY; 
        d.action = "none"; 
    }
    // =========================================================

// =========================================================
    // 4. EXECUTE MOVEMENT
    // =========================================================
    if (!d || typeof d.tx !== 'number' || isNaN(d.tx)) {
        d = { tx: p.x + 1, ty: p.y, action: "none" }; 
    }

    // --- NEW: NET TRAP ESCAPE LOGIC ---
    // This overrides the target if the skater is stuck behind the net
    let finalTx = d.tx;
    let finalTy = d.ty;

    const trapNetX_L = Math.min(goal1, goal2);
    const trapNetX_R = Math.max(goal1, goal2);
    const trapZoneH = 35; // Detection width (slightly wider than net)

    // A. Left Net Trap (Player is behind net, target is forward)
    if (p.x < trapNetX_L && Math.abs(p.y - RY) < trapZoneH && d.tx > p.x) {
        // Force them to the nearest "corner" to go around
        finalTy = (p.y < RY) ? RY - 65 : RY + 65; 
        finalTx = trapNetX_L - 15; 
    }
    // B. Right Net Trap
    else if (p.x > trapNetX_R && Math.abs(p.y - RY) < trapZoneH && d.tx < p.x) {
        finalTy = (p.y < RY) ? RY - 65 : RY + 65;
        finalTx = trapNetX_R + 15;
    }
    // -----------------------------------

    // Navigation (Now uses finalTx/finalTy)
    let navTarget = getNetAvoidanceTarget(p, finalTx, finalTy);
    
    if (d.action === "none") {
        navTarget = applyEvasion(p, navTarget.x, navTarget.y);
    }

    // Movement Angle
    const dx = navTarget.x - p.x;
    const dy = navTarget.y - p.y;
    const distToTarget = Math.hypot(dx, dy);
    const moveAngle = Math.atan2(dy, dx);

    // Face the target (unless shooting/passing logic overrides)
    let desiredFacing = moveAngle;
    const hasPuck = (puck.ownerId === p.id);

    if (hasPuck) {
        if (d.action === "shoot") desiredFacing = Math.atan2(d.ty - p.y, d.tx - p.x);
        else if (d.action === "pass" && d.target) desiredFacing = Math.atan2(d.target.y - p.y, d.target.x - p.x);
    } else if (distToTarget < 20 && !p.stickDropped) {
        desiredFacing = Math.atan2(puck.y - p.y, puck.x - p.x);
    }

    // Apply Rotation
    let angleDiff = normalizeAngle(desiredFacing - p.angle);
    let currentTurnRate = p.turnRate * 1.5;
    angleDiff = clamp(angleDiff, -currentTurnRate, currentTurnRate);
    p.angle += angleDiff;
    
    p.visualBodyAngle = p.angle;



    // Apply Velocity
    let speedDecay = (1 - p.friction);
    p.vx *= speedDecay;
    p.vy *= speedDecay;
    
    let drive = p.baseDrive * p.energy;
    if (distToTarget < 12) drive = 0.001; 

    if (drive > 0) {
        p.vx += Math.cos(p.angle) * drive;
        p.vy += Math.sin(p.angle) * drive;
        p.isAccelerating = true;
    } else {
        p.isAccelerating = false;
    }

    // Cap Speed
    const sp = Math.hypot(p.vx, p.vy);
    if (sp > p.maxSpeed) {
        const s = p.maxSpeed / sp;
        p.vx *= s; p.vy *= s;
    }

    p.x += p.vx;
    p.y += p.vy;

    collideWithRink(p, p.size / 2);

    // =========================================================
    // 5. POSE & ACTIONS
    // =========================================================
    let targetPose = { botX: 6.4, botY: 2.55, rot: 0, reach: 6.4 };

    // Poke Check Reach
    if (!p.stickDropped && (puck.ownerId === null || (puck.ownerId !== p.id && getPlayerById(puck.ownerId).team !== p.team))) {
        const distToPuck = Math.hypot(puck.x - p.x, puck.y - p.y);
        if (distToPuck < 50 && distToPuck > 8) {
            const dxP = puck.x - p.x;
            const dyP = puck.y - p.y;
            const ang = -p.angle;
            const localX = dxP * Math.cos(ang) - dyP * Math.sin(ang);
            const localY = dxP * Math.sin(ang) + dyP * Math.cos(ang);
            targetPose.botX = Math.min(10.2, Math.max(2.5, localX));
            targetPose.botY = Math.min(7.6, Math.max(-7.6, localY));
            targetPose.reach = 6.8;
            targetPose.rot = localX > 20 ? 15 : 0;
        }
    }

    p.pose.botX += (targetPose.botX - p.pose.botX) * 0.2;
    p.pose.botY += (targetPose.botY - p.pose.botY) * 0.2;
    p.pose.rot  += (targetPose.rot - p.pose.rot) * 0.1;
    p.pose.reach += (targetPose.reach - p.pose.reach) * 0.2;

    // Apply Stick Handling
    if (!p.stickDropped) applyStickHandling(p);

    solveSkaterKinematics(p);
    
    // --- PUCK SYNC & WALL CHECK ---
    if (puck.ownerId === p.id) {
        let px = p.cradlePos.x;
        let py = p.cradlePos.y;

        if (p.dribbleLag) {
            const lagX = Math.cos(p.currentStickAngle + Math.PI/2) * p.dribbleLag;
            const lagY = Math.sin(p.currentStickAngle + Math.PI/2) * p.dribbleLag;
            px += lagX;
            py += lagY;
        }

        // Check if stick pushed puck through a wall
        let dropPuck = false;
        const r = puck.r;
        
        // Wall Check
        if (px < RINK_MIN_X + r || px > RINK_MAX_X - r || py < RINK_MIN_Y + r || py > RINK_MAX_Y - r) dropPuck = true;

        // Net Mesh Check
        const leftNetX  = Math.min(goal1, goal2);
        const rightNetX = Math.max(goal1, goal2);
        const netBackDepth = 25; 
        if (px < leftNetX && px > leftNetX - netBackDepth && py > topY && py < botY && p.x < leftNetX - netBackDepth) dropPuck = true;
        if (px > rightNetX && px < rightNetX + netBackDepth && py > topY && py < botY && p.x > rightNetX + netBackDepth) dropPuck = true;

        if (dropPuck) {
            puck.ownerId = null; 
            puck.x = Math.max(RINK_MIN_X + r, Math.min(RINK_MAX_X - r, px));
            puck.y = Math.max(RINK_MIN_Y + r, Math.min(RINK_MAX_Y - r, py));
            puck.vx = 0; puck.vy = 0;
            p.dribblePhase = 0; 
        } else {
            puck.x = px; puck.y = py;
            puck.vx = p.vx; puck.vy = p.vy;
        }
    }

    // Actions
    tryPickupPuck(p);

    if (!p.stickDropped && puck.ownerId !== null && puck.ownerId !== p.id) {
        const owner = getPlayerById(puck.ownerId);
        if (owner && owner.team !== p.team && !goalieLocked) tryStealPuck(p, owner);
    }

    if (hasPuck) {
        if (d.action === "shoot" && Math.abs(angleDiff) < 0.8) {
            // Pass the strategy target (d.tx, d.ty) to the Sniper Engine
            shootPuck(p, undefined, { x: d.tx, y: d.ty });
        }
        else if (d.action === "pass" && d.target && p.passCooldown <= 0 && Math.abs(angleDiff) < 0.4) {
            p.passCooldown = 90;
            passPuckToTeammate(p, d.target);
        }
    }
}



function checkPuckGoalieCollision(puck, g) {
    // --- 1. CONFIGURATION (Tune these numbers!) ---
    const padDepth  = 8;    // How "thick" the pads are (Front to Back)
    const padWidth  = 14;   // Width of ONE pad
    const gapWidth  = 4.0;  // The Five-Hole (Puck is diameter 3.0, so this fits easily)
    const fwdOffset = 6;    // How far "Forward" from the center point the pads sit

    // --- 2. TRANSFORM TO LOCAL SPACE ---
    // We rotate the world around the goalie so calculations are easy (AABB)
    const dx = puck.x - g.x;
    const dy = puck.y - g.y;
    const cos = Math.cos(-g.angle); 
    const sin = Math.sin(-g.angle);
    
    // localX = Distance in front of goalie (Forward/Back)
    // localY = Distance to the side (Left/Right)
    const localX = dx * cos - dy * sin; 
    const localY = dx * sin + dy * cos;

    // --- 3. DEFINE THE TWO BOXES (In Local Space) ---
    // Left Pad is at negative Y, Right Pad is at positive Y
    const leftPadY  = -(gapWidth/2 + padWidth/2);
    const rightPadY = +(gapWidth/2 + padWidth/2);
    
    // Both pads are at the same X (Forward offset)
    const padCenterX = fwdOffset;

    // --- 4. CHECK COLLISION HELPER ---
    function checkPad(pX, pY, boxX, boxY, w, h) {
        // Simple AABB vs Circle logic
        // Find closest point on the box to the puck center
        const closestX = Math.max(boxX - w/2, Math.min(pX, boxX + w/2));
        const closestY = Math.max(boxY - h/2, Math.min(pY, boxY + h/2));
        
        const dX = pX - closestX;
        const dY = pY - closestY;
        const distSq = dX*dX + dY*dY;
        
        if (distSq < (puck.r * puck.r)) {
            // HIT! Return the normal (direction to push out)
            const dist = Math.sqrt(distSq);
            return {
                nx: (dist > 0) ? dX / dist : 1, // Default forward if inside
                ny: (dist > 0) ? dY / dist : 0,
                pen: puck.r - dist // Penetration depth
            };
        }
        return null;
    }

    // Check LEFT Pad
    const hitL = checkPad(localX, localY, padCenterX, leftPadY, padDepth, padWidth);
    // Check RIGHT Pad
    const hitR = checkPad(localX, localY, padCenterX, rightPadY, padDepth, padWidth);

    // Pick the hit (or the stronger hit if both somehow happen)
    const hit = hitL || hitR; 

    if (hit) {
        // --- 5. RESOLVE COLLISION ---
        
        // Rotate the local Normal back to World Space
        const worldCos = Math.cos(g.angle);
        const worldSin = Math.sin(g.angle);
        
        const worldNx = hit.nx * worldCos - hit.nx * worldSin; // Wait, rotation formula check below
        const wx = hit.nx * worldCos - hit.ny * worldSin;
        const wy = hit.nx * worldSin + hit.ny * worldCos;

        // Reflect Velocity: v' = v - 2(v.n)n
        const dot = puck.vx * wx + puck.vy * wy;
        
        // BOUNCE!
        puck.vx = (puck.vx - 2 * dot * wx) * 0.5; // 0.5 dampening (soft pads)
        puck.vy = (puck.vy - 2 * dot * wy) * 0.5;
        
        // Push Out (Prevent sticking)
        puck.x += wx * (hit.pen + 0.5);
        puck.y += wy * (hit.pen + 0.5);

        return true;
    }

    return false;
}


function updateGoalie(p) {
    // 1. Decrement Save Cooldown
    if (p.saveCooldown > 0) p.saveCooldown--;

    const owned = (puck.ownerId === p.id) ? puck : null;

    // --- DEAD PUCK COVER ---
    if (!owned && puck.ownerId === null) {
        const dist = Math.hypot(puck.x - p.x, puck.y - p.y);
        const puckSpeed = Math.hypot(puck.vx, puck.vy);
        if (dist < 32 && puckSpeed < 0.05) {
            puck.ownerId = p.id; puck.vx = 0; puck.vy = 0;
            goalieFreezeTimer = performance.now(); 
            return; 
        }
    }

    // --- POSSESSION LOGIC ---
    if (owned) {
        const stickDist = p.size / 2 + owned.r + 3;
        owned.x = p.x + Math.cos(p.angle) * stickDist;
        owned.y = p.y + Math.sin(p.angle) * stickDist;
        owned.vx = 0; owned.vy = 0;

        if (performance.now() - goalieFreezeTimer > 600) {
            const target = findGoaliePassTarget(p);
            if (target) {
                p.angle = Math.atan2(target.y - p.y, target.x - p.x);
                passPuckToTeammate(p, target);
            } else {
                const weAttackRight = (p.team === 0) ? team0AttacksRight : !team0AttacksRight;
                p.angle = weAttackRight ? 0 : Math.PI;
                shootPuck(p, 10.0); 
            }
            puckStealCooldown = 30; goalieFreezeTimer = 0; goalieLocked = false;
            return;
        }
        return;
    }

    // ============================================================
    // 3. POSITIONING LOGIC
    // ============================================================
    const defendX = (p.team === 0) ? goal1 : goal2; 
    const defendY = RY; 
    const defendingLeft = (defendX < RX);
    const forwardDir = defendingLeft ? 1 : -1;
    const puckInDefHalf = defendingLeft ? (puck.x < RX) : (puck.x > RX);

    // --- A. GEOMETRIC LATERAL TRACKING ---
    let targetY = RY;
    
    if (puckInDefHalf) {
        // Use Absolute Distance (The "Run Away" Fix)
        const distPuckToNet = Math.abs(puck.x - defendX);
        const distGoalieToNet = Math.abs(p.x - defendX);

        let ratio = distGoalieToNet / distPuckToNet;
        
        // Safety Clamps
        if (ratio < 0) ratio = 0;
        if (ratio > 1.0) ratio = 1.0;

        // Project the perfect angle
        targetY = RY + (puck.y - RY) * ratio;
    }

    // --- B. POST SAFETY CLAMP ---
    // Stop 4px inside the post to prevent bank shots
    const goalieLane = (typeof NET_H !== 'undefined' ? NET_H / 2 : 22) - 4; 
    targetY = clamp(targetY, RY - goalieLane, RY + goalieLane);

    // --- C. Y-AXIS MOVEMENT ---
    const urgency = Math.abs(targetY - p.y);
    let moveSpeed = 1.5; // High base speed

    // Sprint if deked out
    if (urgency > 20) moveSpeed = 2.5; 
    
    p.y += clamp(targetY - p.y, -moveSpeed, moveSpeed);


    // --- D. ANGLE & DEPTH ---
    
    // 1. Calculate Angles
    // *** DEFINED HERE so it exists for the depth logic ***
    const baseAngle = Math.atan2(p.y - defendY, p.x - defendX); 
    const puckAngle = Math.atan2(puck.y - p.y, puck.x - p.x);
    
    // Smoothly turn head to face puck
    let diff = normalizeAngle(puckAngle - p.angle);
    diff = clamp(diff, -0.2, 0.2); 
    p.angle += diff;

    // 2. Depth Calculation (Telescoping Logic)
    const angleFromCenter = Math.abs(Math.sin(baseAngle)); 
    
    // Step A: Max Aggression (40px center, 12px post)
    const maxDepth = 40 - (angleFromCenter * (40 - 12));

    // Step B: Scale by Distance (Retreat if puck gets close)
    const distToPuck = Math.hypot(puck.x - p.x, puck.y - p.y);
    let retreatFactor = (distToPuck - 100) / 200; 
    
    if (retreatFactor < 0) retreatFactor = 0;
    if (retreatFactor > 1) retreatFactor = 1;

    // Blend: 8px (Deep) <-> maxDepth (Aggressive)
    const desiredOffset = 8 + (retreatFactor * (maxDepth - 8));
    
    const idealX = defendX + (forwardDir * desiredOffset);
    p.x += clamp(idealX - p.x, -moveSpeed, moveSpeed);

    // Physics
    collideWithRink(p, p.size / 2);
}



function updateAIUsingNN(p) {
    const inputs = buildAIInputs(p);
    const outputs = aiForwardPass(inputs, p.brain);

    // NN Output Order:
    const accel = outputs[0];  // forward thrust
    const brake = outputs[1];  // slow down
    const turnL = outputs[2];  // turn left
    const turnR = outputs[3];  // turn right

    // --- Angle control ---
    if (turnL > 0.1) p.angle -= p.turnRate * turnL;
    if (turnR > 0.1) p.angle += p.turnRate * turnR;

    // --- Velocity control ---
    if (accel > 0.1) {
        const force = accel * 0.08;
        p.vx += Math.cos(p.angle) * force;
        p.vy += Math.sin(p.angle) * force;
    }

    if (brake > 0.1) {
        const factor = 1 - 0.03 * brake;
        p.vx *= factor;
        p.vy *= factor;
    } else {
        p.vx *= (1 - p.friction);
        p.vy *= (1 - p.friction);
    }

    const sp = Math.hypot(p.vx, p.vy);
    if (sp > p.maxSpeed) {
        const s = p.maxSpeed / sp;
        p.vx *= s;
        p.vy *= s;
    }

    p.x += p.vx;
    p.y += p.vy;

    collideWithRink(p, p.size/2);
    tryPickupPuck(p);

    if (puck.ownerId !== null && puck.ownerId !== p.id) {
        const owner = getPlayerById(puck.ownerId);
        if (owner && owner.team !== p.team) {
                if (!goalieLocked) {
                    tryStealPuck(p, owner);
                }

        }
    }

    if (puck.ownerId === p.id && Math.random() < 0.05) {
        shootPuck(p);
    }
}


function updateCelebration(p) {
    // 1. Slow everyone down (friction)
    p.vx *= 0.9;
    p.vy *= 0.9;

    // Goal scorer stays put — teammates skate to him
    const scorer = getPlayerById(lastGoalScorerId);
    const celebrationX = scorer ? scorer.x : puck.x;
    const celebrationY = scorer ? scorer.y : puck.y;

    // ===========================================
    // SCORING TEAM: Huddle at the slot
    // ===========================================
    if (p.team === lastGoalTeam) {
        const dx = celebrationX - p.x;
        const dy = celebrationY - p.y;
        const dist = Math.hypot(dx, dy);

        // If far away, skate slowly toward huddle
        if (dist > 30) {
            const angle = Math.atan2(dy, dx);
            p.angle = angle;
            // move at slow "gliding" speed
            p.x += Math.cos(angle) * 1.8;
            p.y += Math.sin(angle) * 1.8;
        } else {
            // If in the huddle, spin slowly in victory
            p.angle += 0.05;
        }
    } 
    // ===========================================
    // LOSING TEAM: Stop and look away in shame
    // ===========================================
    else {
        // If Team 0 lost (Goal 1 conceded), look Right (0) away from net
        // If Team 1 lost (Goal 2 conceded), look Left (PI) away from net
        const shameAngle = (lastGoalTeam === 0) ? Math.PI : 0;

        // Smoothly turn head to shame angle
        let diff = normalizeAngle(shameAngle - p.angle);
        p.angle += diff * 0.1;
        
        // (Velocity is already killed by friction at top)
    }

    // Keep them inside walls
    collideWithRink(p, p.size/2);

    // ===========================================
    // *** THE FIX: UPDATE BIOMECHANICS ***
    // ===========================================
    
    // 1. Reset Pose to "Idle/Gliding" (Arms down, natural reach)
    // We blend slowly so they lower their sticks if they were shooting
    const idle = SKATER_SPECS.defaultPose;
    p.pose.botX += (idle.botX - p.pose.botX) * 0.1;
    p.pose.botY += (idle.botY - p.pose.botY) * 0.1;
    p.pose.rot  += (idle.rot  - p.pose.rot)  * 0.1;
    p.pose.reach += (idle.reach - p.pose.reach) * 0.1;

    // 2. Sync Visual Body Angle
    p.visualBodyAngle = p.angle;

    // 3. CALCULATE ARMS & STICK POSITION
    // This moves the 'p.topHand', 'p.bladePos', etc to the new body location
    solveSkaterKinematics(p);
}



function updatePlayer(p) {

    //  Apply fatigue and physical limits FIRST ---
    if (p.type === "skater") {
        applyNatureFatigue(p); 
    }
    
    // === NEW: CELEBRATION OVERRIDE ===
    // If a goal happened and we are waiting for reset:
    if (goalResetTimer > performance.now() && lastGoalTeam !== null) {
        if (p.type === "skater") {
            updateCelebration(p);
            return; // Stop here, don't run normal AI
        }
        // Goalies can just chill (or add goalie shame logic here if you want)
        if (p.type === "goalie") {
             p.vx *= 0.9;
             p.vy *= 0.9;
             return;
        }
    }
    // =================================
    
    
    
    
    if (p.type === "skater") {

        // --- TRAINING MODE OVERRIDE ---
        if (TRAINING_MODE && p.team === 0) {
            updateAIUsingNN(p);
            return;
        }
        if (TRAINING_MODE) {
            updateAISkater(p);
            return;
        }

        // --- PLAY MODE ---
        if (p.isHuman) updateHumanSkater(p);
        else           updateAISkater(p);

        return;
    }

    if (p.type === "goalie") {
        updateGoalie(p);
    }
}


// Check if any player is "Camping" in the offensive zone early
// Returns: 0 (Team 0), 1 (Team 1), or null (Clean)
function checkPlayerOffsidePosition() {
    const blueLineL = RX - 110; 
    const blueLineR = RX + 110;
    
    // 1. Determine Zone Boundaries based on attack direction
    // Team 0
    const t0_AttackingRight = team0AttacksRight;
    // Team 1 (Always opposite of Team 0)
    const t1_AttackingRight = !team0AttacksRight;

    for (const p of players) {
        if (p.type !== "skater") continue;

        // --- CHECK TEAM 0 PLAYERS ---
        if (p.team === 0) {
            if (t0_AttackingRight) {
                // Zone starts at Right Blue Line. 
                // Offside if: Player > Line AND Puck <= Line
                if (p.x > blueLineR && puck.x <= blueLineR) return 0;
            } else {
                // Zone starts at Left Blue Line.
                // Offside if: Player < Line AND Puck >= Line
                if (p.x < blueLineL && puck.x >= blueLineL) return 0;
            }
        }
        
        // --- CHECK TEAM 1 PLAYERS ---
        else if (p.team === 1) {
            if (t1_AttackingRight) {
                if (p.x > blueLineR && puck.x <= blueLineR) return 1;
            } else {
                if (p.x < blueLineL && puck.x >= blueLineL) return 1;
            }
        }
    }

    return null; // No one is offside
}



function checkGoalieFreeze() {
    if (puck.ownerId === null) return false;

    const owner = getPlayerById(puck.ownerId);
    if (!owner || owner.type !== "goalie") return false;

    // Time the goalie has held the puck
    const heldMs = performance.now() - goalieFreezeTimer;

    return heldMs > 2000;  // 3 seconds
}

function formatTime(seconds) {
    const min = Math.floor(seconds / 60);
    const sec = Math.floor(seconds % 60);
    
    // Convert to string, but DO NOT pad minutes with a leading zero
    const minStr = String(min); 
    
    // Always pad seconds (e.g., "05")
    const secStr = String(sec).padStart(2, '0');
    
    return `${minStr}:${secStr}`;
}





function updateClock(now) {
    const elapsed = (now - lastGameTimeUpdate) / 1000;

    // Paused states: goals, faceoff pause, menus, intermission... and REPLAYS
    const isPaused =
        (goalResetTimer !== null && now < goalResetTimer) ||
        now < faceoffPauseUntil ||
        // *** THE FIX: Allow 'playing' OR 'playoffs' ***
        (gameState !== "playing" && gameState !== "playoffs") ||
        (typeof isReplaying !== 'undefined' && isReplaying);

    // Normal countdown
    if (!isPaused && timeRemaining > 0) {
        timeRemaining -= elapsed;

        // Period just ended
        if (timeRemaining <= 0) {
            timeRemaining = 0;

            // 1. Set the message based on period
            const prev = currentPeriod; 
            
            if (prev < TOTAL_PERIODS) {
                if (prev === 1) periodMessage = "End of 1st Period";
                else if (prev === 2) periodMessage = "End of 2nd Period";
            } else if (prev === TOTAL_PERIODS) {
                periodMessage = "End of 3rd Period"; 
            } else {
                const otNum = prev - TOTAL_PERIODS; 
                periodMessage = `End of ${otNum}${otNum === 1 ? 'st' : otNum === 2 ? 'nd' : otNum === 3 ? 'rd' : 'th'} OT Period`;
            }

            // 2. Set timer and enter INTERMISSION state
            periodMessageUntil = performance.now() + 3000;
            gameState = "intermission";

            // 3. Reset logic
            const finalizePeriodChange = () => {
                if (performance.now() >= periodMessageUntil) {
                    
                    // A. REGULATION PERIOD END
                    if (currentPeriod < TOTAL_PERIODS) {
                        currentPeriod++;
                        startNextPeriod(); 
                        // Resume correct state
                        gameState = (typeof Playoffs !== 'undefined' && Playoffs.active) ? "playoffs" : "playing";
                    } 
                    // B. 3RD PERIOD / OT END
                    else {
                        if (scoreTeam0 === scoreTeam1) {
                            // TIE -> Go to Next OT Period
                            currentPeriod++;
                            startNextPeriod();
                            gameState = (typeof Playoffs !== 'undefined' && Playoffs.active) ? "playoffs" : "playing";
                        } else {
                            // NO TIE -> Game Over
                            gameState = "gameover";
                        }
                    }
                } else {
                    requestAnimationFrame(finalizePeriodChange);
                }
            };

            requestAnimationFrame(finalizePeriodChange);
        }
    }

    lastGameTimeUpdate = now;
}





function captureReplayFrame() {
    if (isReplaying) return;

    let leftLight = false;
    let rightLight = false;
    
    if (goalResetTimer !== null && performance.now() < goalResetTimer) {
        if (team0AttacksRight) {
            leftLight = (lastGoalTeam === 1);
            rightLight = (lastGoalTeam === 0);
        } else {
            leftLight = (lastGoalTeam === 0);
            rightLight = (lastGoalTeam === 1);
        }
    }

    const frame = {
        puck: { x: puck.x, y: puck.y, ownerId: puck.ownerId },
        lights: { left: leftLight, right: rightLight },
        players: [],
        droppedSticks: droppedSticks.map(s => ({...s}))
    };

    for (const p of players) {
        frame.players.push({
            id: p.id,
            x: p.x,
            y: p.y,
            angle: p.angle,
            vx: p.vx,
            vy: p.vy,
            team: p.team,
            role: p.role,
            size: p.size,
            type: p.type,
            isHuman: p.isHuman,
            isAccelerating: p.isAccelerating,
            strideTick: p.strideTick,
            debugText: p.debugText,
            handing: p.handing,
            
            // --- KINEMATICS DATA ---
            pose: { ...p.pose }, 
            visualBodyAngle: p.visualBodyAngle,
            currentStickAngle: p.currentStickAngle,
            topHand: { ...p.topHand },
            bottomHand: { ...p.bottomHand },
            bladePos: { ...p.bladePos },

            // --- NEW: SAVE DROPPED STICK DATA ---
            // This is the magic. We save the state right here on the player.
            stickDropped: p.stickDropped,
            
        });
    }

    replayBuffer.push(frame);
    if (replayBuffer.length > REPLAY_BUFFER_SIZE) {
        replayBuffer.shift();
    }
}


// 2. START THE SHOW
function startInstantReplay(callback) {
    isReplaying = true;
    setCrowdReplayMode(true);
    replayIndex = 70; 
    replayFinishedCallback = callback; 
}



function toggleManualReplay() {
    // Safety: Buffer must have data
    if (replayBuffer.length === 0) return;

    if (isManualReplay) {
        // --- STOPPING ---
        isManualReplay = false;
        isReplaying = false;
        // Note: isPaused remains true, so we return to the frozen Pause screen.
    } else {
        // --- STARTING ---
        isManualReplay = true;
        isReplaying = true;
        replayIndex = 0; // Start from the beginning of the clip
    }
}



// 3. RENDER THE REPLAY
function renderReplay(ctx) {
    const frameIdx = Math.floor(replayIndex);
    const frame = replayBuffer[frameIdx];

    if (!frame) {
        isReplaying = false;
        if (replayFinishedCallback) replayFinishedCallback();
        return;
    }

    // 1. Draw Background
    ctx.drawImage(offscreenCanvas, 0, 0); 
    if (crowdLayer) ctx.drawImage(crowdLayer, 0, 0);

    // 2. Draw Goal Lights (Using Recorded State)
    if (frame.lights) {
        drawGoalLights(frame.lights.left, frame.lights.right);
    } else {
        drawGoalLights(false, false); 
    }

    // 3. Draw Replay Puck
    ctx.save();
    
    // --- THE FIX: TRUST THE RECORDING ---
    // We simply use the recorded x/y. The live game already put the puck 
    // on the blade (skater) or in the pads (goalie) before saving the frame.
    let drawX = frame.puck.x;
    let drawY = frame.puck.y;
    
    // (Legacy override block removed here)

    ctx.fillStyle = "#000";
    ctx.fillRect(drawX - 1.5, drawY - 1.5, 3, 3);
    ctx.restore();

    // 4. *** NEW: DRAW REPLAY STICKS ***
    // We pass the stick array FROM THE FRAME into our drawing function
    if (frame.droppedSticks) {
        drawDroppedSticks(frame.droppedSticks);
    }

    // 4. Draw Replay Players
    for (const pData of frame.players) {
        const ghost = { ...pData };
        drawPlayer(ghost);
    }

    // 5. Overlay
    ctx.save();
    ctx.fillStyle = "red";
    ctx.font = "bold 24px monospace";
    ctx.textAlign = "center";   
    ctx.textBaseline = "top";    

    const replayY = (typeof RINK_MAX_Y !== 'undefined') ? RINK_MAX_Y + 10 : H - 40;
    
    const text = isManualReplay ? "INSTANT REPLAY (LOOP) - Press 'I' to Exit" : "REPLAY";
    ctx.fillText(text, W / 2, replayY);
    ctx.restore();
    
    replayIndex += 0.4444; 

    // --- NEW LOOPING LOGIC ---
    if (replayIndex >= replayBuffer.length) {
        
        if (isManualReplay) {
            // LOOP IT!
            replayIndex = 0; 
        } else {
            // STOP IT (Normal Goal Behavior)
            isReplaying = false;
            setCrowdReplayMode(false); // +++ AUDIO: Bring volume back up +++
            if (replayFinishedCallback) replayFinishedCallback();
        }
    }

    // 2. ATMOSPHERE TINT (The Darkener)
    // -------------------------------------------------------
    if (atmosphereTint > 0) {
        ctx.fillStyle = `rgba(0, 0, 0, ${atmosphereTint})`; 
        ctx.fillRect(0, 0, W, H);
    }
}






function swapSides() {
    // Flip goals
    const oldGoal1 = goal1;
    goal1 = goal2;
    goal2 = oldGoal1;

    // Flip every player position + facing direction
    for (const p of players) {
        // mirror horizontally around center RX
        p.x = RX + (RX - p.x);

        // flip spawn positions too so next resets use correct sides
        p.spawnX = RX + (RX - p.spawnX);

        // flip goalie home anchors
        if (p.type === "goalie") {
            p.homeX = RX + (RX - p.homeX);
        }

        // flip angle
        // p.angle = normalizeAngle(p.angle + Math.PI);
    }
    
    // Force everyone to face the correct direction immediately
    for (const p of players) {
        const gx = (p.team === 0) ? goal2 : goal1;
        const gy = RY;

        // point stick toward the new attacking direction
        p.angle = Math.atan2(gy - p.y, gx - p.x);
    }
    
    // *** NEW: Flip attack direction flag ***
    team0AttacksRight = !team0AttacksRight;
}




function startNextPeriod() {
    // console.log("Starting Period", currentPeriod);

    timeRemaining = PERIOD_LENGTH_SECONDS;
    lastGameTimeUpdate = performance.now();

    swapSides();

    // Restore every skater to 100% energy (0.95 in your system)
    for (const p of players) {
        if (p.type === "skater") {
            p.energy = 0.95; 
            // Also reset their max speed immediately so the UI reflects the change
            p.maxSpeed = p.baseMaxSpeed * p.energy;
        }
    }
    
    // Call faceoff reset to position players (sets faceoffPauseUntil = 800ms)
    doFaceoffReset(); 

    // --- FIX: OVERRIDE FACE-OFF PAUSE TO MATCH MESSAGE DURATION ---
    // This ensures the game remains paused for the full 3 seconds 
    // while the "End of Period" message is on screen.
    faceoffPauseUntil = performance.now() + 3000; 
    // -------------------------------------------------------------
}

    ctx.fillText(periodText, x + w - 8, y + 28);

function checkGoal() {
    if (isResetActive()) return;

    const r = puck.r;
    const physicalLeftGoal = Math.min(goal1, goal2);
    const physicalRightGoal = Math.max(goal1, goal2);
    const leftTriggerLine = physicalLeftGoal - 5;
    const rightTriggerLine = physicalRightGoal + 5;

    function crossedVertLine(lineX) {
        return (puck.px - r > lineX && puck.x - r <= lineX) ||
               (puck.px + r < lineX && puck.x + r >= lineX) ||
               (puck.px + r > lineX && puck.x + r <= lineX) ||
               (puck.px - r < lineX && puck.x - r >= lineX);
    }

    const top = topY;
    const bottom = botY;
    const inY = puck.y >= top && puck.y <= bottom;
    const isOvertime = currentPeriod > TOTAL_PERIODS;

    // --- LEFT NET GOAL ---
    if (inY && crossedVertLine(leftTriggerLine) && puck.vx < 0) {
        const scoringTeam = team0AttacksRight ? 1 : 0; 
        // console.log(`GOAL: Team ${scoringTeam} scores on the left net`);
        
        if (isOvertime) isSuddenDeathGoal = true; 
        
        // NO WHISTLE CALL HERE. Just start the party.
        resetAfterGoal(scoringTeam);
        return;
    }

    // --- RIGHT NET GOAL ---
    if (inY && crossedVertLine(rightTriggerLine) && puck.vx > 0) {
        const scoringTeam = team0AttacksRight ? 0 : 1; 
        // console.log(`GOAL: Team ${scoringTeam} scores on the right net`);
        
        if (isOvertime) isSuddenDeathGoal = true; 
        
        // NO WHISTLE CALL HERE. Just start the party.
        resetAfterGoal(scoringTeam);
        return;
    }
}





function resetAfterGoal(scoringTeam) {

function createMasterCrowd() {


    const skinTones = [
        '#ffdbac', // Pale
        '#f1c27d', // Tan
        '#e0ac69', // Medium
        '#8d5524', // Deep
        '#c68642'  // Bronze
    ];
    const hairColors = ['#442211', '#221100', '#B8860B', '#63472b', '#111111'];
    const casualColors = [
        '#ffffff', // Pure White
        '#f4f4f4', // Off-White / Light Grey
        '#2c3e50', // Navy Blue
        '#5d6d7e', // Steel Blue
        '#34495e', // Slate
        '#707b7c', // Charcoal
        '#5D4037', // Dark Brown
        '#8D6E63', // Light Brown
        '#1B2631'  // Near Black
    ];

    masterCrowd = [];
    firstWhistleBlown = false; 
    const visitor = Team0_Strategy; 
    const home = Team1_Strategy;

    // 1. HOME ATTENDANCE (Bandwagon Factor)
    // Rank 1 (Top) = 5% no-shows | Rank 18 (Bottom) = 55% no-shows
    const homeRank = getRank(home.id); 
    
    // --- TUNING GUIDE ---
    // Rank 1 (Top) Probability: 0.05 (5% empty)
    // Rank 18 (Bottom) Probability: 0.05 + (17 * 0.03) = 0.56 (56% empty)
    // To make the crowd THICKER: Decrease the 0.03 (e.g., 0.02)
    // To make the crowd THINNER: Increase the 0.03 (e.g., 0.04)
    const noShowProb = 0.02 + ((homeRank - 1) * 0.015); 

    // 2. VISITOR TAKEOVER (Rank + Canadian Factors)
    // Base visitor chance is 5%
    let visitorChance = 0.15; 
    
    // A. Rank Bonus: High-ranking visitors bring more fans (Up to 10% bonus)
    const visitorRank = getRank(visitor.id);
    visitorChance += (19 - visitorRank) * 0.006; 

    // B. Canadian Bonus: Flat 15% boost if it's a Canadian team
    const canadianTeams = ["bt1", "bt2", "bt5", "bt6", "bt7", "bt8", "bt9"];
    if (canadianTeams.includes(visitor.id)) {
        visitorChance += 0.08;
    }

    SEAT_LOCATIONS.forEach((seat, index) => {
        // First check if the seat is even occupied (Home Rank logic)
        if (Math.random() < noShowProb) return; 

        // Then check if the fan is a Home fan or a Visitor
        // We use our new dynamic visitorChance
        const isHomeFan = Math.random() > visitorChance;
        const team = isHomeFan ? home : visitor;
        
        masterCrowd.push({
            x: seat.x,
            y: seat.y,
            isHome: isHomeFan,
            color: (Math.random() < 0.7) ? team.colors.main : team.colors.secondary,
            
            skin: skinTones[Math.floor(Math.random() * skinTones.length)],
            isCasual: Math.random() < 0.50, // 50% wear random clothes
            casualColor: casualColors[Math.floor(Math.random() * casualColors.length)],
            headStyle: Math.floor(Math.random() * 3), // 0: Bald, 1: Hair, 2: Hat
            hairColor: hairColors[Math.floor(Math.random() * hairColors.length)],
            hatColor: (Math.random() < 0.5) ? team.colors.main : team.colors.secondary,

            // Random scattering for exodus
            leaverThreshold: Math.random(), 

            hasLeft: false,
            
            // Late arrival sequence fix (30% as settled)
            isLate: Math.random() < 0.30, 

            fidgetX: 0, 
            fidgetY: 0, 
            fidgetAngle: 0
        });
    });

    generateCrowd(0);
}





function getRank(teamID) {
    // Access the standings object from tournament.js
    if (!Tournament || !Tournament.standings) return 9;

    // Convert the object into an array so we can sort it
    const teamsArray = Object.values(Tournament.standings);
    if (teamsArray.length === 0) return 9;

    // Sort by points (highest to lowest)
    teamsArray.sort((a, b) => b.Pts - a.Pts);

    // Find the rank of the specific team
    const index = teamsArray.findIndex(t => t.id === teamID);
    
    // Return rank (1-18), or 9 (middle) if team not found
    return (index !== -1) ? (index + 1) : 9;
}


function calculateExodus() {
    if (currentPeriod < 3) {
        currentDisappointment = 0;
        return;
    }

    let scoreDiff = scoreTeam1 - scoreTeam0; 

    if (scoreDiff < 0) {
        let intensity = Math.abs(scoreDiff) * 0.2; 
        let timeFactor = (GAME_DURATION_SECONDS - timeRemaining) / GAME_DURATION_SECONDS; 
        currentDisappointment = intensity * timeFactor;

        // --- THE "GOODBYE" LOGIC ---
        // Iterate through the crowd and lock in those who leave
        masterCrowd.forEach(fan => {
            if (fan.isHome && !fan.hasLeft) {
                if (currentDisappointment > fan.leaverThreshold) {
                    fan.hasLeft = true;
                }
            }
        });
    }
}



function updateCrowdVisuals() {
    let disappointment = 0;

    const awayScore = scoreTeam0; 
    const homeScore = scoreTeam1;
    const goalDiff = awayScore - homeScore;

    // Trigger exodus if losing by 3 or more in the 3rd period
    if (currentPeriod === 3 && goalDiff >= 3) {
        // CALCULATE AGGRESSION:
        // We want a "dramatic" exit. Instead of linear, we use a multiplier.
        // As time passes, the disappointment grows much faster.
        const timePercent = (GAME_DURATION_SECONDS - timeRemaining) / GAME_DURATION_SECONDS;
        
        // Raising to power of 0.5 makes it ramp up quickly early in the period
        disappointment = Math.pow(timePercent, 0.6) * (goalDiff / 3);  // changed from 0.5 to 0.6 to increase exodus rate)
    }

    // Clamp at 1.0 (Maximum exit)
    disappointment = Math.min(disappointment, 1.0);

    generateCrowd(disappointment);
}








function doFaceoffReset(dotX = RX, dotY = RY) {
    // 1. RESET PUCK
    puck.ownerId = null;
    puck.vx = 0; puck.vy = 0;
    puck.x = dotX; 
    puck.y = dotY;

    droppedSticks = []; // Clear the ice

    // 2. FLAG THE DROP (New)
    waitingForFaceoffDrop = true;

    // 3. CROWD & LOGIC (Existing)
    if (currentPeriod > 1 || timeRemaining < GAME_DURATION_SECONDS) {
        firstWhistleBlown = true; 
    }
    generateCrowd(typeof currentDisappointment !== 'undefined' ? currentDisappointment : 0);
    applyPendingRosterChanges();

    // 4. DETERMINE ZONE CONTEXT
    const isCenterIce = (Math.abs(dotX - RX) < 10);
    const dotOnRightSide = (dotX > RX); 

    for (const p of players) {
        if (p.type !== "skater") continue;

        // FORCE STICK RECOVERY
        p.stickDropped = false;
        p.droppedStick = null;

        // A. DETERMINE ATTACK DIRECTION
        const t0AttacksRight = team0AttacksRight;
        const weAttackRight = (p.team === 0) ? t0AttacksRight : !t0AttacksRight;
        
        // B. SELECT STRATEGY
        let strategyName = "NEUTRAL";
        if (!isCenterIce) {
            if (weAttackRight && dotOnRightSide) {
                strategyName = "OFFENSIVE";
            } else if (!weAttackRight && !dotOnRightSide) {
                strategyName = "OFFENSIVE";
            } else {
                strategyName = "DEFENSIVE";
            }
        }

        const formation = FACEOFF_STRATEGIES[strategyName];
        const config = formation[p.role] || formation["default"] || FACEOFF_STRATEGIES["default"]["default"];

        // C. APPLY OFFSET
        const dir = weAttackRight ? 1 : -1;
        p.x = dotX + (config.x * dir);
        p.y = dotY + (config.y * dir);
        p.vx = 0; p.vy = 0;

        // D. APPLY ROTATION
        setFaceoffOrientation(p, config.facing, weAttackRight, dotX, dotY);
        p.visualBodyAngle = p.angle;

        // E. RESET POSE
        p.pose = { ...SKATER_SPECS.defaultPose };

        // *** NEW: CENTERS REACH FOR THE DOT ***
        // If this player is a Center, they reach their stick out aggressively.
        if (p.role === "C") {
            p.pose.reach = 4.0; // Reach far forward
            p.pose.botY = -0.1;     // Center the hands
            
            // Slightly crouch (optional visual flair)
            p.pose.botX = 7.0;  
        }

        solveSkaterKinematics(p);
    }

    faceoffPauseUntil = performance.now() + 800;
}



function processFaceoffDrop() {
    if (!waitingForFaceoffDrop) return;

    waitingForFaceoffDrop = false; 

    // 1. Setup
    const winnerTeam = (Math.random() < 0.5) ? 0 : 1;
    
    // "Clean Win" = Puck goes back. "Scramble" = Puck goes sideways/forward.
    const isCleanWin = (Math.random() < 0.55); 

    const t0AttacksRight = team0AttacksRight;
    const winnerAttacksRight = (winnerTeam === 0) ? t0AttacksRight : !t0AttacksRight;
    const forwardDir = winnerAttacksRight ? 1 : -1;

    let dropVx = 0;
    let dropVy = 0;
    
    // Base Power
    const power = 2.0 + Math.random() * 2.0; 

    if (isCleanWin) {
        // --- CLEAN WIN (Dampened) ---
        // We multiply power by 0.6 so it only slides ~50-80 pixels (to the D-men)
        // instead of 300 pixels (to the goalie).
        dropVx = -forwardDir * (power * 0.6); 
        dropVy = (Math.random() - 0.5) * 1.5; 
    } else {
        // --- SCRAMBLE (Chaos) ---
        // Scrambles can stay a bit hotter to create loose puck battles
        dropVx = (Math.random() - 0.5) * 2.0;
        dropVy = (Math.random() < 0.5 ? -1 : 1) * (power * 0.8);
    }

    // 2. Apply Physics
    puck.vx = dropVx;
    puck.vy = dropVy;
    
    // 3. Apply Immunity (Prevents center from instantly grabbing it)
    puck.pickupImmunityUntil = performance.now() + 350;
    
    puck.isShot = false; 
    
    // Reset ownership
    puck.ownerId = null;
    puck.passTargetId = null; 
    puck.lastOwnerId = null; 
}


function setFaceoffOrientation(p, mode, attackingRight, dotX, dotY) {
    let targetX = 0;
    let targetY = 0;

    if (mode === "puck") {
        // Look directly at the specific faceoff dot
        targetX = dotX; 
        targetY = dotY;
    } 
    else if (mode === "opponent") {
        // Look slightly ACROSS the dot (stare down the opponent center)
        const lookDir = attackingRight ? 1 : -1;
        targetX = dotX + (50 * lookDir);
        targetY = dotY;
    }
    else if (mode === "net") {
        // Look at the enemy goal (Standard "Shooting" stance)
        targetX = attackingRight ? goal2 : goal1;
        targetY = RY;
    }
    else {
        // Default / Vertical
        targetX = dotX + (attackingRight ? 100 : -100);
        targetY = dotY;
    }

    p.angle = Math.atan2(targetY - p.y, targetX - p.x);
}





function doGoalReset() {
    // 1. Update Score and Clear Goal State
    if (lastGoalTeam === 0) scoreTeam0++;
    if (lastGoalTeam === 1) scoreTeam1++;
    lastGoalTeam = null; // Clear the last goal state
    goalResetTimer = null; // Clear the celebration timer

    calculateExodus();

    // 2. Reset puck to center (redundant, but safer than relying on doFaceoffReset)
    puck.x = RX;
    puck.y = RY;
    puck.vx = 0;
    puck.vy = 0;
    puck.ownerId = null;
    goalieFreezeTimer = 0;


    doFaceoffReset();
    


    startFaceoffPause();
}




function drawGoalLights(overrideLeft = null, overrideRight = null) {
    // 1. SETUP: Position logic (Attached to the outer glass)
    const boxW = 8;
    const boxH = 18;
    const y = RY - (boxH / 2);
    
    const leftX = RINK_X - boxW - 2; 
    const rightX = RINK_X + RINK_W + 2;

    // 2. LOGIC: Determine State
    let redLeft = false;
    let redRight = false;
    const greenOn = (timeRemaining <= 0);

    if (overrideLeft === null) {
        const isGoalMoment = (goalResetTimer !== null && goalResetTimer > performance.now());
        if (isGoalMoment) {
            if (team0AttacksRight) {
                redLeft = (lastGoalTeam === 1);
                redRight = (lastGoalTeam === 0);
            } else {
                redLeft = (lastGoalTeam === 0);
                redRight = (lastGoalTeam === 1);
            }
        }
    } else {
        redLeft = overrideLeft;
        redRight = overrideRight;
    }

    // 3. DRAW FUNCTION (Enhanced Brightness)
    const drawUnit = (x, isRedOn, isGreenOn) => {
        ctx.save();
        
        // A. The Housing
        ctx.fillStyle = "#222"; 
        ctx.strokeStyle = "#111";
        ctx.lineWidth = 1;
        ctx.fillRect(x, y, boxW, boxH);
        ctx.strokeRect(x, y, boxW, boxH);

        // B. THE RED LIGHT (Top)
        const rY = y + (boxH * 0.25);
        const rX = x + boxW/2;

        if (isRedOn) {
            // 1. The Halo (Large red glow extending 15px out)
            const glow = ctx.createRadialGradient(rX, rY, 2, rX, rY, 18);
            glow.addColorStop(0, "rgba(255, 0, 0, 1.0)");
            glow.addColorStop(0.4, "rgba(255, 0, 0, 0.5)");
            glow.addColorStop(1, "rgba(255, 0, 0, 0)");
            
            ctx.save();
            ctx.globalCompositeOperation = "lighter"; // Additive blending for extra brightness
            ctx.fillStyle = glow;
            ctx.beginPath(); ctx.arc(rX, rY, 18, 0, Math.PI*2); ctx.fill();
            ctx.restore();

            // 2. The Bulb (Hot white center)
            ctx.beginPath(); ctx.arc(rX, rY, 3, 0, Math.PI*2);
            ctx.fillStyle = "#ffcccc"; // Near white
            ctx.fill();
        } else {
            // Off State (Dull)
            ctx.beginPath(); ctx.arc(rX, rY, 3, 0, Math.PI*2);
            ctx.fillStyle = "#440000"; 
            ctx.fill();
        }

        // C. THE GREEN LIGHT (Bottom)
        // NHL Rule: Green cannot be on if Red is on
        const gY = y + (boxH * 0.75);
        const effectiveGreen = isGreenOn && !isRedOn;
        
        if (effectiveGreen) {
            // 1. The Halo
            const glow = ctx.createRadialGradient(rX, gY, 2, rX, gY, 15);
            glow.addColorStop(0, "rgba(0, 255, 0, 1.0)");
            glow.addColorStop(1, "rgba(0, 255, 0, 0)");
            
            ctx.save();
            ctx.globalCompositeOperation = "lighter";
            ctx.fillStyle = glow;
            ctx.beginPath(); ctx.arc(rX, gY, 15, 0, Math.PI*2); ctx.fill();
            ctx.restore();

            // 2. The Bulb
            ctx.beginPath(); ctx.arc(rX, gY, 3, 0, Math.PI*2);
            ctx.fillStyle = "#ccffcc"; // Near white
            ctx.fill();
        } else {
            ctx.beginPath(); ctx.arc(rX, gY, 3, 0, Math.PI*2);
            ctx.fillStyle = "#002200"; 
            ctx.fill();
        }

        ctx.restore();
    };

    // 4. EXECUTE
    drawUnit(leftX, redLeft, greenOn);
    drawUnit(rightX, redRight, greenOn);
}

function generateCrowd(disappointment = 0) {
    const crowdCanvas = document.createElement('canvas');
    crowdCanvas.width = 1000; crowdCanvas.height = 600;
    const cctx = crowdCanvas.getContext('2d');

    // --- CONFIGURABLE SIZE VARIABLES ---
    const bW = 11; // Width of horizontal body
    const bH = 7;  // Height of horizontal body
    const sT = 3;  // Stripe Thickness
    // ------------------------------------

    const visitor = Team0_Strategy; 
    const home = Team1_Strategy;

    masterCrowd.forEach(fan => {
        const topXStart = 180, topXEnd = 820, topYStart = 0,   topYEnd = 240; 
        const botXStart = 190, botXEnd = 820, botYStart = 360, botYEnd = 600; 
        const leftXLimit = 180, rightXLimit = 820;
        const midYStart = 250, midYEnd = 440;

        if (fan.isLate && !firstWhistleBlown) return;
        if (fan.hasLeft) return; 

        const team = fan.isHome ? home : visitor;
        const stripColor = (fan.color === team.colors.main) ? team.colors.secondary : team.colors.main;
        const rad = 3; // Corner radius for the "capsule" look
        
        // 1. TOP SECTION (Facing DOWN)
        if (fan.x >= topXStart && fan.x <= topXEnd && fan.y >= topYStart && fan.y <= topYEnd) {
            // CLOTHING: Use casual color or team color
            cctx.fillStyle = fan.isCasual ? fan.casualColor : fan.color;
            cctx.beginPath();
            cctx.roundRect(fan.x - (bW/2) + fan.fidgetX, fan.y - (bH/2) + fan.fidgetY, bW, bH, rad);
            cctx.fill();
            
            // STRIPE: Only draw if wearing a jersey
            if (!fan.isCasual) {
                cctx.fillStyle = stripColor;
                cctx.beginPath();
                cctx.roundRect(fan.x - (bW/2) + fan.fidgetX, fan.y - (sT/2) + fan.fidgetY, bW, sT, rad);
                cctx.fill();
            }

            // HEAD: Use individual skin tone
            cctx.fillStyle = fan.skin;
            cctx.beginPath(); 
            cctx.arc(fan.x + 0.5 + fan.fidgetX, fan.y + 2 + fan.fidgetY, 2, 0, Math.PI * 2); 
            cctx.fill();

            // HAIR OR HATS
            if (fan.headStyle === 1) { // HAIR
                cctx.fillStyle = fan.hairColor;
                cctx.beginPath();
                // Draw a small arc over the top of the head
                cctx.arc(fan.x + 0.5 + fan.fidgetX, fan.y + 1.5 + fan.fidgetY, 2, Math.PI, 0);
                cctx.fill();
            } else if (fan.headStyle === 2) { // HAT
                cctx.fillStyle = fan.hatColor;
                // Draw a tiny rectangle for a cap
                cctx.fillRect(fan.x - 1 + fan.fidgetX, fan.y + 0.5 + fan.fidgetY, 3, 2);
            }
        }
    // 2. BOTTOM SECTION (Facing UP)
    else if (fan.x >= botXStart && fan.x <= botXEnd && fan.y >= botYStart && fan.y <= botYEnd) {
        cctx.fillStyle = fan.isCasual ? fan.casualColor : fan.color;
        cctx.beginPath();
        cctx.roundRect(fan.x - (bW/2) + fan.fidgetX, fan.y - (bH/2) + fan.fidgetY, bW, bH, rad);
        cctx.fill();
        
        if (!fan.isCasual) {
            cctx.fillStyle = stripColor;
            cctx.beginPath();
            cctx.roundRect(fan.x - (bW/2) + fan.fidgetX, fan.y - (sT/2) + fan.fidgetY, bW, sT, rad);
            cctx.fill();
        }

        cctx.fillStyle = fan.skin;
        cctx.beginPath(); 
        cctx.arc(fan.x + 0.5 + fan.fidgetX, fan.y - 2 + fan.fidgetY, 2, 0, Math.PI * 2); 
        cctx.fill();

        if (fan.headStyle === 1) { // HAIR
            cctx.fillStyle = fan.hairColor;
            cctx.beginPath();
            cctx.arc(fan.x + 0.5 + fan.fidgetX, fan.y - 2.5 + fan.fidgetY, 2, Math.PI, 0);
            cctx.fill();
        } else if (fan.headStyle === 2) { // HAT
            cctx.fillStyle = fan.hatColor;
            cctx.fillRect(fan.x - 1 + fan.fidgetX, fan.y - 2.5 + fan.fidgetY, 3, 2);
        }
    }
    // 3. LEFT END (Facing RIGHT)
    else if (fan.x < leftXLimit && fan.y >= midYStart && fan.y <= midYEnd) {
        cctx.fillStyle = fan.isCasual ? fan.casualColor : fan.color;
        cctx.beginPath();
        cctx.roundRect(fan.x - (bH/2) + fan.fidgetX, fan.y - (bW/2) + fan.fidgetY, bH, bW, rad);
        cctx.fill();
        
        if (!fan.isCasual) {
            cctx.fillStyle = stripColor;
            cctx.beginPath();
            cctx.roundRect(fan.x - (sT/2) + fan.fidgetX, fan.y - (bW/2) + fan.fidgetY, sT, bW, rad);
            cctx.fill();
        }

        cctx.fillStyle = fan.skin;
        cctx.beginPath(); 
        cctx.arc(fan.x + 2.5 + fan.fidgetX, fan.y + fan.fidgetY, 2, 0, Math.PI * 2); 
        cctx.fill();

        if (fan.headStyle === 1) { // HAIR
            cctx.fillStyle = fan.hairColor;
            cctx.beginPath();
            cctx.arc(fan.x + 2.0 + fan.fidgetX, fan.y + fan.fidgetY, 2, -Math.PI/2, Math.PI/2);
            cctx.fill();
        } else if (fan.headStyle === 2) { // HAT
            cctx.fillStyle = fan.hatColor;
            cctx.fillRect(fan.x + 0.5 + fan.fidgetX, fan.y - 1.5 + fan.fidgetY, 2, 3);
        }
    }
    // 4. RIGHT END (Facing LEFT)
    else if (fan.x > rightXLimit && fan.y >= midYStart && fan.y <= midYEnd) {
        cctx.fillStyle = fan.isCasual ? fan.casualColor : fan.color;
        cctx.beginPath();
        cctx.roundRect(fan.x - (bH/2) + fan.fidgetX, fan.y - (bW/2) + fan.fidgetY, bH, bW, rad);
        cctx.fill();
        
        if (!fan.isCasual) {
            cctx.fillStyle = stripColor;
            cctx.beginPath();
            cctx.roundRect(fan.x - (sT/2) + fan.fidgetX, fan.y - (bW/2) + fan.fidgetY, sT, bW, rad);
            cctx.fill();
        }

        cctx.fillStyle = fan.skin;
        cctx.beginPath(); 
        cctx.arc(fan.x - 2.5 + fan.fidgetX, fan.y + fan.fidgetY, 2, 0, Math.PI * 2); 
        cctx.fill();

        if (fan.headStyle === 1) { // HAIR
            cctx.fillStyle = fan.hairColor;
            cctx.beginPath();
            cctx.arc(fan.x - 2.0 + fan.fidgetX, fan.y + fan.fidgetY, 2, Math.PI/2, -Math.PI/2);
            cctx.fill();
        } else if (fan.headStyle === 2) { // HAT
            cctx.fillStyle = fan.hatColor;
            cctx.fillRect(fan.x - 2.5 + fan.fidgetX, fan.y - 1.5 + fan.fidgetY, 2, 3);
        }
    }
    // 5. CORNERS (Rotated)
    else {
        cctx.save();
        cctx.translate(fan.x + fan.fidgetX, fan.y + fan.fidgetY);
        
        let angle = 0;
        if (fan.x < 500 && fan.y < 300) angle = -225 * Math.PI / 180;
        else if (fan.x >= 500 && fan.y < 300) angle = 225 * Math.PI / 180;
        else if (fan.x < 500 && fan.y >= 300) angle = 45 * Math.PI / 180;
        else angle = -45 * Math.PI / 180;

        cctx.rotate(angle + fan.fidgetAngle);

        cctx.fillStyle = fan.isCasual ? fan.casualColor : fan.color;
        cctx.beginPath();
        cctx.roundRect(-(bW/2), -(bH/2), bW, bH, rad);
        cctx.fill();

        if (!fan.isCasual) {
            cctx.fillStyle = stripColor;
            cctx.beginPath();
            cctx.roundRect(-(bW/2), -(sT/2), bW, sT, rad);
            cctx.fill();
        }

        cctx.fillStyle = fan.skin;
        cctx.beginPath(); 
        cctx.arc(0, -(bH/2) + 1.5, 2, 0, Math.PI * 2); 
        cctx.fill();

        if (fan.headStyle === 1) { // HAIR
            cctx.fillStyle = fan.hairColor;
            cctx.beginPath();
            cctx.arc(0, -(bH/2) + 1.0, 2, Math.PI, 0);
            cctx.fill();
        } else if (fan.headStyle === 2) { // HAT
            cctx.fillStyle = fan.hatColor;
            cctx.fillRect(-1.5, -(bH/2) - 0.5, 3, 2);
        }
        
        cctx.restore();
    }
    });

    crowdLayer = crowdCanvas;
}

let lastCrowdUpdate = 0;

function updateLivingCrowd() {
    const now = performance.now();
    
    // 1. THROTTLE: Only update every 120ms (approx 8 times a second)
    // This locks the crowd animation speed to real time, not frame rate.
    if (now - lastCrowdUpdate < 120) return;
    
    lastCrowdUpdate = now;

    // 2. TRIGGER CONDITIONS (The Wave / Fidgets)
    const isThirdPeriod = (typeof currentPeriod !== 'undefined' && currentPeriod === 3); 
    const homeTeamLeadByThree = (typeof scoreTeam1 !== 'undefined' && typeof scoreTeam0 !== 'undefined' && scoreTeam1 - scoreTeam0 >= 3);

    // Note: executeTheWave() must exist in your crowd_data.js or similar
    if (isThirdPeriod && homeTeamLeadByThree && typeof executeTheWave === 'function') {
        executeTheWave();
    } else {
        // Run Standard Fidgets
        if (typeof masterCrowd !== 'undefined') {
            masterCrowd.forEach(fan => {
                let currentExcitement = fan.isHome ? team1Excitement : team0Excitement;

                if (Math.random() < currentExcitement) {
                    let range = currentExcitement > AMBIENT_EXCITEMENT ? 4.0 : AMBIENT_RANGE;
                    
                    fan.fidgetX = (Math.random() * (range * 2) - range); 
                    fan.fidgetY = (Math.random() * (range * 2) - range);
                    fan.fidgetAngle = (Math.random() * (range * 0.2) - (range * 0.1));
                }
            });
        }
    }

    // 3. REDRAW
    if (typeof generateCrowd === 'function' && typeof currentDisappointment !== 'undefined') {
        generateCrowd(currentDisappointment);
    }
}

    else if (z===5) { box = {x:390, y:260, w:220, h:120}; } 
    else if (z===6) { box = {x:390, y:380, w:220, h:220}; } 

    // OFFENSIVE ZONE (610 - 1000)
    else if (z===7) { box = {x:610, y:0, w:290, h:260}; } // Top (Width 290)
    else if (z===8) { box = {x:610, y:260, w:290, h:120}; } // Slot
    else if (z===9) { box = {x:610, y:380, w:290, h:220}; } // Bot
    else if (z===10){ box = {x:900, y:0, w:100, h:600}; } // Deep

            ctx.fill();
            ctx.strokeStyle = "black";
            ctx.stroke();
            
            ctx.fillStyle = "white";
            ctx.font = "bold 12px Arial";
            ctx.fillText("C"+(i+1), c.x, c.y - 12);

    // -----------------------------------------
    // C. DRAW PASSING STATS (Top Right)
    // -----------------------------------------
    if (window.BT8_STATS) {
        const s = window.BT8_STATS;
        const pct = s.attempts > 0 ? Math.round((s.completions / s.attempts) * 100) : 0;
        const text = `PASSING: ${s.completions} / ${s.attempts} (${pct}%)`;
        
        ctx.font = "bold 16px Monospace";
        
        // Calculate box size based on text width
        const textMetrics = ctx.measureText(text);
        const boxW = textMetrics.width + 30;
        const boxH = 34;
        
        const boxX = 1000 - boxW - 20; 
        const boxY = 20;

        ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
        ctx.fillRect(boxX, boxY, boxW, boxH);
        ctx.strokeStyle = "#00ff00";
        ctx.lineWidth = 2;
        ctx.strokeRect(boxX, boxY, boxW, boxH);

        ctx.fillStyle = "#00ff00";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(text, boxX + boxW/2, boxY + boxH/2);
    }

    ctx.restore();
}

function solveSkaterKinematics(p) {
    const s = SKATER_SPECS;
    const handDir = p.handing || 1; 

    // --- FETCH DRIBBLE OFFSETS ---
    const dRot = p.dribbleRot || 0;
    const dY   = p.dribbleY || 0;

    // 1. Body & Hands
    const torsoRotRad = ((p.pose.rot + dRot) * Math.PI / 180);
    const totalRot = p.visualBodyAngle + torsoRotRad;
    const cos = Math.cos(totalRot);
    const sin = Math.sin(totalRot);

    const toWorld = (lx, ly) => ({
        x: p.x + (lx * cos) - (ly * sin),
        y: p.y + (lx * sin) + (ly * cos)
    });

    p.topHand = toWorld(s.topX, s.topY * handDir);
    p.bottomHand = toWorld(p.pose.botX, (p.pose.botY + dY) * handDir);

    // 2. Stick Angle
    const stickDX = p.bottomHand.x - p.topHand.x;
    const stickDY = p.bottomHand.y - p.topHand.y;
    p.currentStickAngle = Math.atan2(stickDY, stickDX);

    // 3. Blade Position
    p.bladePos = {
        x: p.bottomHand.x + Math.cos(p.currentStickAngle) * p.pose.reach,
        y: p.bottomHand.y + Math.sin(p.currentStickAngle) * p.pose.reach
    };

    // 4. Wall Clamp (Blade Safety)
    // We keep the blade inside so the stick doesn't look like it's piercing the glass
    const wallBuffer = 2.5; 
    const minX = (typeof RINK_MIN_X !== 'undefined') ? RINK_MIN_X : 100;
    const maxX = (typeof RINK_MAX_X !== 'undefined') ? RINK_MAX_X : 900;
    const minY = (typeof RINK_MIN_Y !== 'undefined') ? RINK_MIN_Y : 150;
    const maxY = (typeof RINK_MAX_Y !== 'undefined') ? RINK_MAX_Y : 490;

    if (p.bladePos.x < minX + wallBuffer) p.bladePos.x = minX + wallBuffer;
    if (p.bladePos.x > maxX - wallBuffer) p.bladePos.x = maxX - wallBuffer;
    if (p.bladePos.y < minY + wallBuffer) p.bladePos.y = minY + wallBuffer;
    if (p.bladePos.y > maxY - wallBuffer) p.bladePos.y = maxY - wallBuffer;

    // 5. CRADLE CALCULATION (Puck Position)
    const visualBladeAngle = p.currentStickAngle - (0.7 * handDir);
    const normAng = visualBladeAngle + Math.PI/2;
    
    const maxGap = 1.5; 
    const baseMag = Math.abs(s.cradleY) + maxGap;

    let crossoverFactor = 0;
    if (typeof p.dribblePhase !== 'undefined') {
        const wave = Math.sin(p.dribblePhase);
        crossoverFactor = Math.tanh(wave * 4); 
    } else {
        crossoverFactor = 1.0; 
    }

    let dir = Math.sign(s.cradleY * handDir); 
    if (dir === 0) dir = 1;
    let pocketDepth = baseMag * dir * crossoverFactor; 

    p.cradlePos = {
        x: p.bladePos.x + (Math.cos(visualBladeAngle) * s.cradleX) + (Math.cos(normAng) * pocketDepth),
        y: p.bladePos.y + (Math.sin(visualBladeAngle) * s.cradleX) + (Math.sin(normAng) * pocketDepth)
    };

    // --- 6. CRADLE CLAMP (THE FIX) ---
    // Ensure the puck itself NEVER clips through the wall, regardless of animation.
    // We clamp slightly more aggressively than the blade (puck.r is usually ~2.0)
    const puckR = (typeof puck !== 'undefined') ? puck.r : 2.0;
    const puckBuffer = puckR + 0.5;

    if (p.cradlePos.x < minX + puckBuffer) p.cradlePos.x = minX + puckBuffer;
    if (p.cradlePos.x > maxX - puckBuffer) p.cradlePos.x = maxX - puckBuffer;
    if (p.cradlePos.y < minY + puckBuffer) p.cradlePos.y = minY + puckBuffer;
    if (p.cradlePos.y > maxY - puckBuffer) p.cradlePos.y = maxY - puckBuffer;
}



function applyStickHandling(p) {
    if (puck.ownerId !== p.id) {
        // Reset state
        p.dribblePhase = 0;
        p.dribbleRot = 0; 
        p.dribbleY = 0;   
        p.dribbleLag = 0; 
        p.onBackhand = false; 
        return;
    }

    // =========================================================
    // *** THE MASTER CONTROL ***
    // =========================================================
    // 1.0 = Full Wide Dangles (The "Sweeping" look)
    // 0.5 = Tight Dangles (The "Half-Range" look)
    // 0.3 = Micro Dangles (Very subtle control)
    const HANDLING_RANGE = 0.5; 
    // =========================================================


    if (typeof p.dribblePhase === 'undefined') p.dribblePhase = 0;
    if (typeof p.rhythmClock === 'undefined') p.rhythmClock = Math.random() * 100;

    // 1. Rhythm & Speed (Unchanged)
    p.rhythmClock += 0.02;
    const speedMod = Math.sin(p.rhythmClock);
    const currentSpeed = 0.12 + (speedMod * 0.05);

    p.dribblePhase += currentSpeed;
    
    const wave = Math.sin(p.dribblePhase);
    const handDir = p.handing || 1;

    // 2. Determine Side
    p.onBackhand = (wave < 0);

    // 3. Width Scale (Dynamic adjustment based on speed)
    const widthScale = 1.0 - (speedMod * 0.2); 

    // 4. APPLY LINKED OFFSETS
    // We use the "Maximum" values (5.0, 25, 1.5) as the baseline,
    // and multiply ALL of them by your HANDLING_RANGE.
    
    // A. Stick Sweep
    p.dribbleY = (wave * 5.0) * widthScale * HANDLING_RANGE;      

    // B. Wrist Roll 
    p.dribbleRot = (wave * 25) * handDir * HANDLING_RANGE;  
    
    // C. Puck Lag
    p.dribbleLag = (-wave * 1.5) * handDir * HANDLING_RANGE;   
}

function resolveTeamPalette(teamId) {
    const strat = (teamId === 0) ? Team0_Strategy : Team1_Strategy;
    const isHome = (teamId === 1);

    // --- A. NEW SYSTEM (Explicit 8-Layer Config) ---
    // Check BOTH locations: 
    // 1. Top level (strat.uniforms) - rare
    // 2. Inside colors object (strat.colors.uniforms) - standard from Builder
    const customKit = (strat && strat.uniforms) ? strat.uniforms : 
                      (strat && strat.colors && strat.colors.uniforms) ? strat.colors.uniforms : null;

    if (customKit) {
        return isHome ? customKit.home : customKit.away;
    }

    // --- B. LEGACY FALLBACK (Auto-Generate 8 Stripes) ---
    const cMain = (strat && strat.colors) ? strat.colors.main : "#555";
    const cSec  = (strat && strat.colors) ? strat.colors.secondary : "#ccc";
    
    let helmet, layers;

    if (isHome) {
        const body = (strat && strat.useWhiteJersey) ? "#ffffff" : cMain;
        const trim = (strat && strat.useWhiteJersey) ? cMain : cSec;
        const pants = cMain; 

        helmet = cMain;
        layers = [
            body, body, body, body, body, // 1-5: Jersey Body
            trim, trim,                   // 6-7: Hem Stripe
            pants                         // 8:   Pants
        ];
    } else {
        // AWAY FALLBACK
        helmet = "#ffffff";
        const body = "#ffffff";
        const trim = cMain;
        const pants = cMain;

        layers = [
            body, body, body, body, body, 
            trim, trim,                   
            pants                         
        ];
    }

    return { helmet: helmet, jerseyLayers: layers };
}


// =========================================================
// DRAW
// =========================================================
function drawPlayer(p) {
    if (p.type === "goalie") { drawGoalie(p); return; }

    if (!p.topHand || isNaN(p.topHand.x)) {
        if (!p.pose) return; 
        solveSkaterKinematics(p);
    }

    const s = SKATER_SPECS;
    const handDir = p.handing || 1; 
    const totalRot = p.visualBodyAngle + (p.pose.rot * Math.PI / 180);
    const kit = resolveTeamPalette(p.team);

    // --- 1. SHADOW ---
    ctx.save();
    ctx.translate(p.x, p.y);
    const shadowSize = p.size * 0.85; 
    const offX = 4.0; const offY = 6.0;
    const shadowGrd = ctx.createRadialGradient(offX, offY, 2, offX, offY, shadowSize);
    shadowGrd.addColorStop(0, "rgba(0, 0, 0, 0.45)"); 
    shadowGrd.addColorStop(1, "rgba(0, 0, 0, 0)"); 
    ctx.fillStyle = shadowGrd;
    ctx.beginPath(); ctx.arc(offX, offY, shadowSize, 0, Math.PI * 2); ctx.fill();
    ctx.restore(); 

    // --- 2. DRAW STICK ---
    if (!p.stickDropped) {
        ctx.strokeStyle = "#5d4037"; 
        ctx.lineWidth = 1.3 * SKATER_SCALE; 
        ctx.beginPath();
        const knobX = p.topHand.x - Math.cos(p.currentStickAngle) * s.knobLength;
        const knobY = p.topHand.y - Math.sin(p.currentStickAngle) * s.knobLength;
        ctx.moveTo(knobX, knobY);
        ctx.lineTo(p.bladePos.x, p.bladePos.y);
        ctx.stroke();
    }

    // =========================================================
    // 3. THE 8-STRIPE JERSEY ENGINE
    // =========================================================
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(totalRot);

    // A. Define Body Shape (Mask)
    ctx.beginPath();
    ctx.roundRect(-s.bodyW/2, -s.bodyH/2, s.bodyW, s.bodyH, 2.5);
    ctx.save();
    ctx.clip(); 

    // B. Draw Stripes
    const layers = kit.jerseyLayers || ["#888","#888","#888","#888","#888","#888","#888","#888"];
    const sliceLen = s.bodyW / 8; 
    
    for (let i = 0; i < 8; i++) {
        ctx.fillStyle = layers[i];
        const xPos = (s.bodyW / 2) - ((i + 1) * sliceLen);
        ctx.fillRect(xPos - 0.1, -s.bodyH/2, sliceLen + 0.2, s.bodyH);
    }

    ctx.restore(); // Remove Clip

    // =========================================================
    // C. HEAD (Standard + Clean Dot Marker)
    // =========================================================

    // 1. Draw the Base Head (Identical for everyone)
    ctx.fillStyle = kit.helmet; 
    ctx.beginPath(); 
    ctx.arc(s.headX, 0, s.headRad, 0, Math.PI*2); 
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.5)"; ctx.lineWidth = 0.6; ctx.stroke();

    // 2. Add Human Marker (Simple Dot)
    if (p.isHuman) {
        // Away Team (0) -> Black Dot
        // Home Team (1) -> White Dot
        ctx.fillStyle = (p.team === 0) ? "#000000" : "#ffffff";
        
        ctx.beginPath();
        // Draw a dot slightly smaller than the helmet (radius ~1.8 vs 3.4)
        ctx.arc(s.headX, 0, 1.0, 0, Math.PI*2);
        ctx.fill();
    }

    ctx.restore();

    // 4. DRAW BLADE TIP
    if (!p.stickDropped) {
        ctx.save();
        ctx.translate(p.bladePos.x, p.bladePos.y);
        ctx.rotate(p.currentStickAngle - (0.7 * handDir)); 
        ctx.fillStyle = "black"; 
        const bladeL = 6.6 * SKATER_SCALE;
        const bladeH = 2.0 * SKATER_SCALE;
        ctx.fillRect(-bladeH/2, -bladeH/2, bladeL, bladeH); 
        ctx.restore();
    }
}




// Helper for drawing the "Pseudo-Arms" (SMALLER GLOVES)
function drawArmSegment(hand, shoulder, armColor, gloveColor) {
    const dx = shoulder.x - hand.x;
    const dy = shoulder.y - hand.y;
    const ang = Math.atan2(dy, dx);
    
    // Clamp visual length
    const dist = Math.min(SKATER_SPECS.maxArmLength + 2, Math.hypot(dx, dy));
    
    ctx.save();
    ctx.translate(hand.x, hand.y);
    ctx.rotate(ang);
    
    // 1. Draw Arm
    ctx.fillStyle = armColor; 
    ctx.beginPath(); 
    ctx.roundRect(0, -1.5, dist, 3, 1.5); 
    ctx.fill();
    
    // 2. Draw Glove (Reduced Size)
    ctx.fillStyle = gloveColor; 
    ctx.beginPath(); 
    // Radius reduced from 2.5 -> 1.8
    ctx.arc(0, 0, 1.8, 0, Math.PI*2); 
    ctx.fill();
    
    ctx.restore();
}




function drawGoalie(p) {
    ctx.save();
    ctx.translate(p.x, p.y);

    // --- 1. SHADOW ---
    const shadowSize = p.size * 0.95;
    const offX = 1; const offY = 1;
    const shadowGrd = ctx.createRadialGradient(offX, offY, 2, offX, offY, shadowSize);
    shadowGrd.addColorStop(0, "rgba(0, 0, 0, 0.45)");
    shadowGrd.addColorStop(1, "rgba(0, 0, 0, 0)");
    ctx.fillStyle = shadowGrd;
    ctx.beginPath();
    ctx.arc(offX, offY, shadowSize, 0, Math.PI * 2);
    ctx.fill();

    // --- 2. POSSESSION INDICATOR ---
    const hasPuck = (puck.ownerId === p.id);
    if (hasPuck) {
        // ctx.beginPath();
        // ctx.arc(0, 0, p.size * 0.60, 0, Math.PI * 2);
        // ctx.strokeStyle = "rgba(88, 88, 88, 0.7)";
        // ctx.lineWidth = 3.0;
        // ctx.stroke();
    }

    ctx.rotate(p.angle);

    // Geometry Constants
    const shoulderWidth = p.size;
    const depth = p.size * 0.8;
    const halfS = shoulderWidth / 2;
    const halfD = depth / 2;

    const side = p.handing || 1; 
    
    // *** NEW: RESOLVE UNIFORM ***
    // This grabs the exact same 8-layer config as the skaters
    const kit = resolveTeamPalette(p.team);
    
    // Default pad colors (Use secondary or white if missing)
    // We can use the 7th stripe (Hem) as a proxy for "Trim Color" for pads
    const padColor = kit.jerseyLayers ? kit.jerseyLayers[6] : "#ffffff";

    // --- 3. DRAW STICK (Shaft + Blade) ---
    ctx.save();
    ctx.translate(halfD, (halfS * 0.4) * side); 
    ctx.rotate(1.5 * side); 

    const shaftF = 1, shaftB = 15, bladeL = 9, bladeS = -0.5;
    
    ctx.fillStyle = "#222"; 
    ctx.beginPath();
    ctx.roundRect(-shaftB, -1.1, shaftB + shaftF, 1.2, 1); 
    ctx.fill();

    ctx.translate(shaftF - 1, -0.4 * side); 
    ctx.rotate(bladeS * side); 
    
    ctx.beginPath(); 
    ctx.roundRect(0, 2 * side, bladeL, 2.7, 1); 
    ctx.fill();
    ctx.restore();

    // --- 4. DRAW BLOCKER ---
    ctx.save();
    ctx.translate(halfD - 1, (-halfS * 0.8) * side); 
    ctx.rotate(-0.2 * side);
    ctx.fillStyle = padColor; 
    ctx.beginPath();
    ctx.roundRect(-2, -4, 4, 8, 1);
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.3)"; ctx.lineWidth = 0.5; ctx.stroke();
    ctx.restore();

    // --- 5. DRAW CATCHER ---
    ctx.save();
    ctx.translate(halfD - 3, (halfS * 0.8) * side); 
    ctx.rotate(0.4 * side);
    ctx.fillStyle = padColor; 
    ctx.beginPath();
    ctx.roundRect(-3, -3, 6, 6, 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.3)"; ctx.lineWidth = 0.5; ctx.stroke();
    ctx.restore();

    // =========================================================
    // 6. THE 8-STRIPE BODY ENGINE (ADAPTED FOR GOALIE)
    // =========================================================
    ctx.save();
    
    // A. Define Clipping Mask (Rounded Rectangle)
    ctx.beginPath();
    ctx.roundRect(-halfD, -halfS, depth, shoulderWidth, 2);
    ctx.clip(); // Mask everything to the body shape

    // B. Draw Stripes
    const layers = kit.jerseyLayers || Array(8).fill("#888");
    const sliceLen = depth / 8; // Slice the "Depth" (X-Axis)

    for (let i = 0; i < 8; i++) {
        ctx.fillStyle = layers[i];
        
        // Draw from Front (Neck) to Back (Waist)
        // Goalie "Front" is Positive X (halfD)
        // Stripe 0 starts at Front Edge
        
        const xPos = halfD - ((i + 1) * sliceLen);
        
        // Draw Slice (Slight overlap to prevent gaps)
        ctx.fillRect(xPos - 0.1, -halfS, sliceLen + 0.2, shoulderWidth);
    }
    
    ctx.restore(); // Remove Clip

    // --- 7. HEAD/HELMET ---
    const headRadius = (shoulderWidth * 0.6) / 2;
    ctx.fillStyle = kit.helmet; 
    ctx.beginPath();
    // Head is positioned slightly forward (Positive X)
    ctx.arc(halfD - headRadius + 2, 0, headRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.5)"; ctx.lineWidth = 1; ctx.stroke();

    ctx.restore();
}

function serializeBrain(brain) {
    return {
        inputSize: brain.inputSize,
        hiddenSize: brain.hiddenSize,
        outputSize: brain.outputSize,
        w1: brain.w1,
        b1: brain.b1,
        w2: brain.w2,

    };
}

function deserializeBrain(data) {
    return {
        inputSize: data.inputSize,
        hiddenSize: data.hiddenSize,
        outputSize: data.outputSize,
        w1: data.w1,
        b1: data.b1,
        w2: data.w2,

    };
}
