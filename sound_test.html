<!DOCTYPE html>
<html>
<head>
    <title>Audio Sprite V3</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; text-align: center; padding: 50px; }
        #btn { padding: 20px 40px; font-size: 20px; cursor: pointer; background: #00d2ff; border: none; font-weight: bold; border-radius: 5px;}
        #btn:disabled { background: #555; cursor: not-allowed; color: #888; }
        #debug { margin-top: 20px; font-family: monospace; color: #ff5555; white-space: pre-wrap; }
        #success { margin-top: 20px; font-family: monospace; color: #00ff00; font-size: 1.2em; }
    </style>
</head>
<body>
    <h1>🔊 AUDIO SYSTEM V3</h1>
    <p>Loading <code>sprite.mp3</code> via Relative Path</p>
    
    <button id="btn" onclick="startEngine()">INITIATE AUDIO</button>
    
    <div id="success"></div>
    <div id="debug"></div>

    <script>
        // 1. RELATIVE PATH (Fixes the CORS/www error)
        const SRC = 'sprite.mp3'; 
        const LEN = 50912; // 50.912 seconds

        let crowd = null;

        function startEngine() {
            // 2. DISABLE BUTTON IMMEDIATELY (Prevents "Too Many Players" crash)
            let btn = document.getElementById('btn');
            if (btn.disabled) return; // Stop if already clicking
            btn.disabled = true;
            btn.innerText = "Downloading...";
            
            document.getElementById('debug').innerText = "";

            // 3. DEFINE THE ENGINE
            crowd = new Howl({
                src: [SRC],
                html5: false, // Web Audio API (Best for looping sprites)
                format: ['mp3'],
                sprite: {
                    low:  [0,       LEN, true],
                    mid:  [LEN,     LEN, true],
                    high: [LEN * 2, LEN, true]
                },
                onload: function() {
                    // 4. SUCCESS
                    document.getElementById('success').innerText = "✅ AUDIO LOADED & PLAYING";
                    btn.innerText = "Running";
                    
                    // Use 'this' to reference the specific sound instance safely
                    let id1 = this.play('low');
                    let id2 = this.play('mid');
                    let id3 = this.play('high');
                    
                    // Set initial mix (Low only)
                    this.volume(1.0, id1);
                    this.volume(0.0, id2);
                    this.volume(0.0, id3);
                },
                onloaderror: function(id, err) {
                    // 5. ERROR HANDLING
                    let msg = "Unknown Error";
                    if (err === 4) msg = "File Not Found (Check filename case/location)";
                    else if (err === 3) msg = "Decoding Error (Bad MP3 export)";
                    
                    console.error("Howler Error:", err);
                    document.getElementById('debug').innerText = "❌ FAILED: " + msg + "\n(Error Code: " + err + ")";
                    
                    // Re-enable button to try again
                    btn.disabled = false;
                    btn.innerText = "Retry Connection";
                }
            });
        }
    </script>
</body>
</html>
