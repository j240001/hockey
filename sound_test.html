<!DOCTYPE html>
<html>
<head>
    <title>Floating Ambience Mixer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    <style>
        body { background: #222; color: #fff; font-family: sans-serif; text-align: center; padding: 40px; }
        
        button { padding: 15px 30px; font-size: 20px; background: #00d2ff; border: none; cursor: pointer; font-weight: bold; border-radius: 5px; margin-bottom: 40px; }
        button:disabled { background: #444; color: #888; cursor: default; }

        .track { background: #333; padding: 20px; margin: 10px auto; width: 600px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; }
        
        label { font-weight: bold; width: 80px; text-align: left; }
        input[type=range] { flex-grow: 1; margin: 0 20px; }
        .data { font-family: monospace; width: 140px; text-align: right; font-size: 12px; color: #aaa; }
        .vol-txt { color: #00ff00; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🌫️ "Floating" Crowd Mixer</h1>
    <p>Random Start + Micro-Speed Drift = Infinite Texture</p>

    <button id="btn" onclick="init()">START RANDOMIZED ENGINE</button>

    <div class="track">
        <label>LOW</label>
        <input type="range" min="0" max="100" value="100" oninput="setVol('low', this.value)">
        <div class="data">
            <span id="info-low">Waiting...</span><br>
            <span id="txt-low" class="vol-txt">100%</span>
        </div>
    </div>

    <div class="track">
        <label>MID</label>
        <input type="range" min="0" max="100" value="0" oninput="setVol('mid', this.value)">
        <div class="data">
            <span id="info-mid">Waiting...</span><br>
            <span id="txt-mid" class="vol-txt">0%</span>
        </div>
    </div>

    <div class="track">
        <label>HIGH</label>
        <input type="range" min="0" max="100" value="0" oninput="setVol('high', this.value)">
        <div class="data">
            <span id="info-high">Waiting...</span><br>
            <span id="txt-high" class="vol-txt">0%</span>
        </div>
    </div>

    <script>
        // 1. SETUP
        var sound = new Howl({
            src: ['sprite.mp3'], 
            html5: false,
            sprite: {
                low:  [0,      50912, true],
                mid:  [50912,  50912, true],
                high: [101824, 50912, true]
            }
        });

        var idLow, idMid, idHigh;
        const LENGTH = 50.9;

        // 2. START ENGINE
        function init() {
            if (idLow) return; 

            document.getElementById('btn').disabled = true;
            document.getElementById('btn').innerText = "Running...";

            // Play all 3 tracks
            idLow  = sound.play('low');
            idMid  = sound.play('mid');
            idHigh = sound.play('high');

            // --- THE FLOATING LOGIC ---
            applyFloat('low', idLow);
            applyFloat('mid', idMid);
            applyFloat('high', idHigh);

            // Apply volumes
            sound.volume(1.0, idLow); 
            sound.volume(0.0, idMid); 
            sound.volume(0.0, idHigh); 
        }

        function applyFloat(name, id) {
            // 1. RANDOM START: Pick a random second between 0 and 50
            var startPoint = Math.random() * LENGTH;
            sound.seek(startPoint, id);

            // 2. RATE DRIFT: Random speed between 0.98x and 1.02x
            // This ensures they slide past each other constantly.
            var drift = 0.98 + (Math.random() * 0.04); 
            sound.rate(drift, id);

            // Update UI
            document.getElementById('info-' + name).innerText = 
                "Start: " + startPoint.toFixed(1) + "s\nRate: " + drift.toFixed(3) + "x";
        }

        // 3. VOLUME CONTROL
        function setVol(track, val) {
            if (!idLow) return; 
            var decimal = val / 100;
            
            if (track === 'low') {
                sound.volume(decimal, idLow);
                document.getElementById('txt-low').innerText = val + "%";
            }
            else if (track === 'mid') {
                sound.volume(decimal, idMid);
                document.getElementById('txt-mid').innerText = val + "%";
            }
            else if (track === 'high') {
                sound.volume(decimal, idHigh);
                document.getElementById('txt-high').innerText = val + "%";
            }
        }
    </script>
</body>
</html>
