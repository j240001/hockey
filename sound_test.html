<!DOCTYPE html>
<html>
<head>
    <title>Simple Audio Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    <style>
        body { background: #222; color: #fff; font-family: sans-serif; text-align: center; padding: 50px; }
        input { width: 400px; margin-top: 20px; }
        button { padding: 15px 30px; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Simple Additive Mixer</h1>
    
    <button id="btn" onclick="init()">START AUDIO</button>
    
    <br><br>
    
    <label>Excitement (0 to 100)</label><br>
    <input type="range" min="0" max="100" value="0" oninput="mix(this.value)">

    <p id="status">Waiting...</p>

    <script>
        // 1. SETUP
        // Using relative path to fix CORS
        var sound = new Howl({
            src: ['sprite.mp3'],
            html5: false, // Must be false for responsive looping
            sprite: {
                low:  [0,      50912, true],
                mid:  [50912,  50912, true],
                high: [101824, 50912, true]
            }
        });

        var idLow, idMid, idHigh;

        // 2. START (Runs Once)
        function init() {
            if (idLow) return; // Prevent double-clicking

            document.getElementById('btn').disabled = true;
            document.getElementById('status').innerText = "Playing...";

            // Play all 3 layers constantly
            idLow  = sound.play('low');
            idMid  = sound.play('mid');
            idHigh = sound.play('high');

            // Set initial mix (Low only)
            mix(0);
        }

        // 3. MIXING LOGIC (The "Layer Cake")
        function mix(val) {
            if (!idLow) return;
            
            var e = val / 100; // Convert 0-100 to 0.0-1.0

            // LAYER 1 (Low): ALWAYS ON at 100%
            // It provides the "body" of the sound.
            sound.volume(1.0, idLow);

            // LAYER 2 (Mid): Fades in linearly from 0% to 100%
            sound.volume(e, idMid);

            // LAYER 3 (High): Only starts fading in after 50% excitement
            // Math: If e is 0.5, volume is 0. If e is 1.0, volume is 1.
            var highVol = (e - 0.5) * 2;
            if (highVol < 0) highVol = 0;
            
            sound.volume(highVol, idHigh);
        }
    </script>
</body>
</html>
